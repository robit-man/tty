}
.traffic-legend { flex-wrap: wrap; justify-content: flex-start; }
.traffic-legend span { display: inline-flex; align-items: center; gap: 5px; }
.traffic-legend i { inline-size: 9px; block-size: 2px; background: var(--traffic-color); }
.traffic-in { --traffic-color: var(--connected); }
.traffic-out { --traffic-color: #e0ab69; }
.traffic-legend #traffic-peak { margin-inline-start: auto; }
#traffic-graph { display: block; inline-size: 100%; block-size: 66px; overflow: visible; }
#traffic-graph line { stroke: var(--edge); }
#traffic-graph path { fill: none; stroke: var(--traffic-color); stroke-width: 1.65; vector-effect: non-scaling-stroke; }
#stats-sessions { display: grid; gap: 9px; }
.stats-session { display: grid; gap: 4px; padding-block-end: 8px; border-block-end: 1px solid var(--edge); }
.stats-session-title { justify-content: flex-start; }
.stats-session-title strong { min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats-session-title button { margin-inline-start: auto; }
.stats-session-state { color: var(--muted); font-size: .75rem; }
.stats-session-state[data-online="true"] { color: var(--connected); }
.stats-session-detail { font-variant-numeric: tabular-nums; }
#stats-empty { margin: 0; }
.stats-actions, .share-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.stats-actions button, .share-tabs button { block-size: 38px; padding: 0 5px; font-size: .8125rem; }

#share-dialog .modal-panel { inline-size: min(100%, 368px); }
.share-tabs button[aria-selected="true"] { background: var(--selected); border-color: var(--edge-strong); }
.share-hint { margin: 0; line-height: 1.45; overflow-wrap: anywhere; }
.share-pane, #share-invite, #share-approval, #share-join { display: grid; gap: var(--gap); min-inline-size: 0; }
#share-source, #share-mode { color: var(--text); background: #101010; }
#share-qr {
  display: block;
  inline-size: min(100%, 212px);
  block-size: auto;
  justify-self: center;
  border-radius: var(--radius);
  image-rendering: pixelated;
}
.share-pin-block {
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 7px;
  border: 1px solid var(--edge);
  border-radius: var(--radius);
}
#share-pin { font: 600 1.45rem/1.2 ui-monospace, monospace; letter-spacing: .23em; padding-inline-start: .23em; }
.share-pin-entry {
  min-inline-size: 0;
  inline-size: min(100%, 236px);
  margin: 0 auto;
  padding: 0;
  border: 0;
}
.share-pin-entry legend { margin-inline: auto; padding: 0 0 5px; }
.share-pin-cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
.share-pin-cell {
  padding: 0;
  font: 600 1.125rem ui-monospace, monospace;
  text-align: center;
  text-transform: uppercase;
}
.share-permissions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--gap);
}
.share-permissions button { color: var(--muted); }
.share-permissions button[aria-pressed="true"] {
  color: var(--text);
  background: var(--selected);
  border-color: var(--edge-strong);
}
@media (forced-colors: active) {
  .share-permissions button[aria-pressed="true"] { outline: 2px solid Highlight; outline-offset: -3px; }
}
#share-peers { display: grid; gap: var(--gap); }
.share-peer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--gap);
}
.share-peer button { inline-size: auto; block-size: 32px; font-size: .8125rem; }
.terminal-content { position: relative; -webkit-touch-callout: none; }
#term-menu {
  position: fixed;
  z-index: 8;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  max-inline-size: min(calc(100vw - 16px), 320px);
  padding: 4px;
  border: 1px solid var(--edge-strong);
  border-radius: var(--radius);
  background: var(--black);
  box-shadow: 0 8px 28px rgb(0 0 0 / .65);
}
#term-menu[hidden] { display: none; }
#term-menu button {
  min-block-size: 38px;
  padding: 0 12px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 14px;
}
#term-menu button:hover, #term-menu button:focus-visible { background: var(--hover); }
#term-menu button:disabled { color: var(--muted); background: transparent; }
#term-menu input {
  flex: 1 0 100%;
  min-block-size: 38px;
  padding: 0 10px;
  border: 1px solid var(--edge);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 16px;
}
.peer-cursors { position: absolute; inset: 0 auto auto 0; z-index: 2; overflow: hidden; pointer-events: none; }
.peer-cursor {
  position: absolute;
  display: flex;
  align-items: flex-start;
  gap: 2px;
  color: var(--peer-color);
}
.peer-cursor svg { inline-size: 15px; block-size: 17px; fill: currentColor; stroke: #000; stroke-width: 1; }
.peer-cursor span {
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--peer-color);
  color: #000;
  font: 600 10px/1.35 system-ui, sans-serif;
  white-space: nowrap;
}
#share-camera {
  inline-size: 100%;
  block-size: clamp(100px, 24dvh, 188px);
  background: #111;
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  object-fit: cover;
}
#share-status[data-error="true"] { color: var(--error); }
#share-approval .modal-button { padding-inline: 4px; }
#share-stop { color: var(--error); }
</style>
</head>
<body>
<svg class="icon-definitions" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="icon-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" /></symbol>
  <symbol id="icon-minus" viewBox="0 0 16 16"><path d="M3.5 8h9" /></symbol>
  <symbol id="icon-share" viewBox="0 0 16 16"><circle cx="12" cy="3.5" r="1.75" /><circle cx="4" cy="8" r="1.75" /><circle cx="12" cy="12.5" r="1.75" /><path d="m5.55 7.2 4.9-2.9M5.55 8.8l4.9 2.9" /></symbol>
  <symbol id="icon-trash" viewBox="0 0 16 16"><path stroke-linejoin="round" d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 8.5h6.6l.7-8.5M6.75 7v4M9.25 7v4" /></symbol>
  <symbol id="icon-fork" viewBox="0 0 16 16"><circle cx="5" cy="3" r="1.6" /><circle cx="5" cy="13" r="1.6" /><circle cx="11" cy="4.5" r="1.6" /><path d="M5 4.6v6.8M11 6.1c0 3.4-6 2.4-6 5.3" /></symbol>
  <symbol id="icon-close" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8" /></symbol>
  <symbol id="icon-pointer" viewBox="0 0 16 18"><path d="M2 1v14l3-3 3 5 3-2-3-5h5z" /></symbol>
</svg>
<div id="app">
  <div id="controls">
    <button id="toggle-sessions" class="icon-button" type="button" aria-label="Show sessions"
        aria-controls="session-sidebar" aria-expanded="false" title="Show sessions">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 4l4 4-4 4" />
      </svg>
    </button>
    <button id="add-session" class="icon-button" type="button" aria-label="New session"
        aria-haspopup="dialog" aria-controls="connect-dialog" title="New session">
      <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-plus" /></svg>
    </button>
    <button id="session-status" class="icon-button" type="button" aria-label="Disconnected. Open connection statistics"
        aria-controls="connection-menu" aria-expanded="false" title="Disconnected">
      <span class="status-dot" aria-hidden="true"></span>
    </button>
  </div>
  <main id="workspace" aria-label="Terminal workspace">
    <aside id="session-sidebar" aria-label="Sessions" inert>
      <div class="sidebar-content">
        <div id="tabs" role="tablist" aria-label="SSH sessions" aria-orientation="vertical"></div>
        <button id="add-sidebar-session" class="tab-row sidebar-add" type="button" aria-label="New session"
            aria-haspopup="dialog" aria-controls="connect-dialog" title="New session">
          <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-plus" /></svg>
        </button>
        <div id="sidebar-trash" aria-hidden="true" title="Drop here to close the session" hidden>
          <svg class="control-icon" viewBox="0 0 16 16"><use href="#icon-trash" /></svg>
        </div>
      </div>
    </aside>
    <div id="terminals">
      <div id="panes"></div>
      <div id="dock-targets" aria-hidden="true" hidden></div>
    </div>
  </main>
  <div id="soft-keys" role="group" aria-label="Terminal keyboard controls" hidden></div>
  <div id="term-menu" role="menu" aria-label="Terminal text" hidden>
    <button type="button" role="menuitem" id="term-copy">Copy</button>
    <button type="button" role="menuitem" id="term-paste">Paste</button>
    <button type="button" role="menuitem" id="term-select-all">Select all</button>
    <input id="term-paste-field" type="text" placeholder="Paste here" aria-label="Paste text into the terminal" hidden>
  </div>
  <section id="connection-menu" aria-labelledby="connection-menu-title" hidden>
    <header>
      <h2 id="connection-menu-title">Connections</h2>
      <button id="close-stats" class="icon-button" type="button" aria-label="Close connection statistics">
        <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-close" /></svg>
      </button>
    </header>
    <div class="traffic-panel">
      <div class="traffic-legend">
        <span class="traffic-in"><i aria-hidden="true"></i>Received</span>
        <span class="traffic-out"><i aria-hidden="true"></i>Sent</span>
        <span id="traffic-peak"></span>
      </div>
      <svg id="traffic-graph" viewBox="0 0 290 66" preserveAspectRatio="none" role="img" aria-label="TTY traffic over the last 30 seconds">
        <line x1="0" y1="1" x2="290" y2="1"></line><line x1="0" y1="33" x2="290" y2="33"></line>
        <line x1="0" y1="65" x2="290" y2="65"></line>
        <path id="traffic-rx" class="traffic-in"></path><path id="traffic-tx" class="traffic-out"></path>
      </svg>
    </div>
    <div id="stats-sessions" aria-label="Per-session statistics"></div>
    <p id="stats-empty">No terminal sessions</p>
    <div class="stats-actions">
      <button id="stats-connect" class="modal-button" type="button">Connect to SSH</button>
      <button id="stats-scan" class="modal-button" type="button">Connect by QR</button>
    </div>
  </section>
  <div id="announcement" class="visually-hidden" role="status"></div>
</div>
<div id="pane-font-menu" role="group" aria-label="Terminal text size" hidden>
  <button id="pane-font-smaller" class="font-step" type="button" aria-label="Decrease text size">
    <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-minus" /></svg>
  </button>
  <output id="pane-font-value" aria-live="polite"></output>
  <button id="pane-font-larger" class="font-step" type="button" aria-label="Increase text size">
    <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-plus" /></svg>
  </button>
</div>
<dialog id="connect-dialog" aria-label="Connect to SSH">
  <form id="connect-form" class="modal-panel" tabindex="-1" autofocus novalidate>
    <div id="recents">
      <button id="recents-toggle" class="modal-button" type="button" aria-controls="recent-list"
          aria-expanded="false">Recents</button>
      <div id="recent-list" role="group" aria-label="Recent SSH sessions" hidden>
        <div id="recent-items"></div>
        <p id="recent-empty">No recent sessions</p>
        <button id="clear-recents" type="button" hidden>Clear recents</button>
      </div>
    </div>
    <input id="endpoint" class="field" type="text" placeholder="Browser terminal link"
        aria-label="Browser terminal link" inputmode="url" autocomplete="off"
        autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" required>
    <input id="username" class="field" type="text" placeholder="SSH username"
        aria-label="SSH username" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" enterkeyhint="go" maxlength="64" required>
    <p id="connect-error" role="alert" hidden></p>
    <button id="connect" class="modal-button primary" type="submit" disabled>
      <span id="connect-label"><span id="spinner" class="spinner" aria-hidden="true" hidden></span><span id="connect-text">Connect</span></span>
    </button>
  </form>
</dialog>
<dialog id="close-dialog" aria-labelledby="close-heading" aria-describedby="close-detail">
  <div class="modal-panel">
    <h1 id="close-heading">Close session?</h1>
    <p id="close-detail">The terminal connection will end.</p>
    <div class="confirm-actions">
      <button id="keep-session" class="modal-button" type="button">Cancel</button>
      <button id="close-session" class="modal-button primary" type="button" autofocus>Close</button>
    </div>
  </div>
</dialog>
<dialog id="share-dialog" aria-labelledby="share-heading">
  <section class="modal-panel" tabindex="-1" autofocus>
    <header class="share-heading">
      <h2 id="share-heading">Terminal sharing</h2>
      <button id="share-close" class="icon-button" type="button" aria-label="Close terminal sharing">
        <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-close" /></svg>
      </button>
    </header>
    <div id="sharing-tabs" class="share-tabs" role="tablist" aria-label="Terminal sharing">
      <button id="share-tab" class="modal-button" role="tab" aria-controls="share-panel" aria-selected="true" type="button">Share</button>
      <button id="share-connect-tab" class="modal-button" role="tab" aria-controls="share-connect-panel" aria-selected="false" type="button">Connect</button>
    </div>
    <div id="share-panel" class="share-pane" role="tabpanel" aria-labelledby="share-tab">
      <p id="share-invite-hint" class="share-hint">Share a terminal you’ve already signed in to. The approved peer can see its screen and type in it.</p>
      <button id="share-generate" class="modal-button primary" type="button">Create invite</button>
      <div id="share-invite" hidden>
        <img id="share-qr" alt="One-time terminal invite QR code">
        <div class="share-pin-block">
          <span class="share-hint">Tell the other person this PIN separately</span>
          <output id="share-pin" aria-label="Invite PIN"></output>
        </div>
        <div class="share-controls">
          <button id="share-copy" class="modal-button" type="button">Copy invite</button>
          <button id="share-cancel" class="modal-button" type="button">Cancel invite</button>
        </div>
        <p id="share-expiry" class="share-hint"></p>
      </div>
      <div id="share-approval" hidden>
        <p id="share-approval-detail" class="share-hint"></p>
        <div id="share-approval-permissions" class="share-permissions" role="group" aria-label="Allow this peer to">
          <button class="modal-button" data-permission="view" type="button" aria-pressed="true">View</button>
          <button class="modal-button" data-permission="write" type="button" aria-pressed="false">Write</button>
        </div>
        <div class="share-controls">
          <button id="share-decline" class="modal-button" type="button">Decline</button>
          <button id="share-approve" class="modal-button primary" type="button">Approve</button>
        </div>
      </div>
      <div id="share-peers" aria-label="Connected peers" hidden></div>
    </div>
    <div id="share-connect-panel" class="share-pane" role="tabpanel" aria-labelledby="share-connect-tab" hidden>
      <button id="share-scan" class="modal-button" type="button">Scan with camera</button>
      <video id="share-camera" autoplay muted playsinline hidden aria-label="Invite QR camera view"></video>
      <form id="share-join">
        <input id="share-link" class="field" type="text" aria-label="Terminal invite link" placeholder="Or paste an invite link"
            inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2048">
        <select id="share-mode" class="field" aria-label="What to share">
          <option value="request">Request their terminal</option>
          <option value="give">Share my terminal</option>
        </select>
        <select id="share-source" class="field" aria-label="Your terminal to share" hidden></select>
        <div id="share-offer-permissions" class="share-permissions" role="group" aria-label="Allow this peer to" hidden>
          <button class="modal-button" data-permission="view" type="button" aria-pressed="true">View</button>
          <button class="modal-button" data-permission="write" type="button" aria-pressed="false">Write</button>
        </div>
        <fieldset class="share-pin-entry">
          <legend class="share-hint">4-character PIN</legend>
          <div class="share-pin-cells">
            <input class="field share-pin-cell" type="text" aria-label="PIN character 1 of 4"
                autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1" enterkeyhint="next">
            <input class="field share-pin-cell" type="text" aria-label="PIN character 2 of 4"
                autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1" enterkeyhint="next">
            <input class="field share-pin-cell" type="text" aria-label="PIN character 3 of 4"
                autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1" enterkeyhint="next">
            <input class="field share-pin-cell" type="text" aria-label="PIN character 4 of 4"
                autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1" enterkeyhint="go">
          </div>
        </fieldset>
        <button id="share-verify" class="modal-button primary" type="submit" disabled>Verify PIN</button>
      </form>
    </div>
    <p id="share-status" class="share-hint" role="status" hidden></p>
    <button id="share-stop" class="modal-button" type="button" hidden>Leave shared terminal</button>
  </section>
</dialog>

<script id="tty-share-transport">
(() => {
  'use strict';

  const {connect} = window.TTYShareVendor;
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', {fatal: true});
  const relay = 'wss://demo.nats.io:8443';
  const version = 'v2';
  const pinAlphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const pinPattern = new RegExp('^[' + pinAlphabet + ']{4}$');
  const roomPattern = /^([A-Za-z0-9_-]{22})\.([A-Za-z0-9_-]{87})$/;
  const lifetime = 120000;
  // Keep-Alive packets are authenticated and remain active only after approval.
  const heartbeat = 8000;
  const maxFrame = 262144;
  const maxQueue = 1048576;
  const kind = Object.freeze({join: 1, allow: 2, reject: 3, screen: 4, input: 5,
    output: 6, resize: 7, ping: 8, end: 9, cursor: 10});

  function encodeBytes(bytes) {
    return btoa(String.fromCharCode(...bytes)).replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
  }

  function decodeBytes(value) {
    return Uint8Array.from(atob(value.replaceAll('-', '+').replaceAll('_', '/')), char => char.charCodeAt(0));
  }

  const pack = value => encoder.encode(JSON.stringify(value));
  const unpack = bytes => JSON.parse(decoder.decode(bytes));
  const randomId = () => encodeBytes(crypto.getRandomValues(new Uint8Array(16)));
  const generateKey = () => crypto.subtle.generateKey({name: 'ECDH', namedCurve: 'P-256'}, false, ['deriveBits']);
  const publicKey = async keys => encodeBytes(new Uint8Array(await crypto.subtle.exportKey('raw', keys.publicKey)));
  const route = room => 'robit.tty.share.' + version + '.' + room;
  const newPIN = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), value => pinAlphabet[value & 31]).join('');
  const hasPermissions = value => Boolean(value && typeof value.view === 'boolean' &&
    typeof value.write === 'boolean' && (value.view || value.write));

  function parseInvite(value) {
    if (typeof value !== 'string' || value.length > 2048) return null;
    try {
      const url = new URL(value.trim(), location.href);
      // An invite supplies a key and room only. Never navigate to or fetch the scanned address.
      if ((url.protocol !== 'https:' && url.origin !== location.origin) || url.username || url.password) return null;
      const hash = new URLSearchParams(url.hash.slice(1));
      const room = hash.get('ttyshare') || '';
      if (!room.startsWith(version + '.')) return null;
      const match = roomPattern.exec(room.slice(version.length + 1));
      if (!match || decodeBytes(match[2])[0] !== 4 || encodeBytes(decodeBytes(match[1])) !== match[1]
          || encodeBytes(decodeBytes(match[2])) !== match[2]) return null;
      return {room: match[1], hostKey: match[2]};
    } catch (_) {
      return null;
    }
  }

    const remoteKey = await crypto.subtle.importKey('raw', decodeBytes(host ? guestKey : hostKey),

    return {outgoing, incoming, proof};
  }

  function pinProofLink(room, attempt, mode, permissions, pin) {
    return pack(['tty-share-pin', version, room, attempt, mode, permissions ? [permissions.view, permissions.write] : null, pin]);
  }

  async function openRelay() {
    return connect({servers: relay, reconnect: false, ignoreServerUpdates: true,
      timeout: 8000, pingInterval: 15000, maxPingOut: 2, waitOnFirstConnect: false});
  }

  async function quietClose(nc) {
    const timer = setTimeout(() => nc.close(), 1000);
    try { if (!nc.isClosed()) await nc.flush(); } catch (_) {}
    clearTimeout(timer);
    await nc.close();

      this.nc = nc;
      this.invite = invite;
      this.attempt = attempt;
      this.guestKey = guestKey;
      this.keys = keys;
      this.host = host;

      this.outSeq = this.inSeq = this.queuedOut = this.queuedIn = 0;
      this.outbox = this.inbox = Promise.resolve();

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const {Terminal, FitAddon} = window.XTERM_BUNDLE;
  const app = $('app');
  const sidebar = $('session-sidebar');
  const tabs = $('tabs');
  const terminals = $('terminals');
  const paneArea = $('panes');
  const dockTargets = $('dock-targets');
  const softKeys = $('soft-keys');
  const sidebarToggle = $('toggle-sessions');
  const fontMenu = $('pane-font-menu');
  const smallerFont = $('pane-font-smaller');
  const largerFont = $('pane-font-larger');
  const statusButton = $('session-status');
  const addButton = $('add-session');
  const connectDialog = $('connect-dialog');
  const closeDialog = $('close-dialog');
  const form = $('connect-form');
  const endpoint = $('endpoint');
  const username = $('username');
  const connectButton = $('connect');
  const connectError = $('connect-error');
  const recents = $('recents');
  const recentToggle = $('recents-toggle');
  const recentList = $('recent-list');
  const clearRecents = $('clear-recents');
  const mobile = matchMedia('(any-pointer: coarse)');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const encoder = new TextEncoder();
  const minFontSize = 8;
  const maxFontSize = 32;
  const dividerSize = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--divider-size'));
  const sshUser = /^[A-Za-z_][A-Za-z0-9_.-]{0,63}$/;
  const tunnelHost = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com$/;
  const tunnelToken = /^[A-Za-z0-9_-]{32,128}$/;
  const recentKey = 'tty-recent-sessions';
  const recentLimit = 8;
  const sessions = [];
  const modifiers = {Ctrl: false, Shift: false, Alt: false};
  const modifierButtons = new Map();
  let active = null;
  let paneLayout = null;
  const visiblePanes = new Map();
  let drag = null;
  let suppressClick = null;
  let fontSession = null;
  let touchCloseRow = null;
  let sidebarOpen = false;
  let intake = null;
  let connectAnchor = null;
  let recentSessions = [];
  let closingSession = null;
  let nextSession = 1;
  let fitFrame = 0;
  let normalHeight = 0;
  let lastWidth = 0;
  let keyboardOpen = false;
  let lastUser = '';
  try { lastUser = localStorage.getItem('tty-last-user') || ''; } catch (_) {}

  const statusText = {
    offline: 'Disconnected',
    connecting: 'Connecting',
    reconnecting: 'Reconnecting',
    online: 'Connected'
  };

  const connectionMenu = $('connection-menu');
  const shareDialog = $('share-dialog');
  const sharing = window.TTYShare;
  const shareTypes = sharing.kind;
  const maxSharePeers = 6;
  const shareCamera = $('share-camera');
  const shareLink = $('share-link');
  const shareMode = $('share-mode');
  const shareSource = $('share-source');
  const sharePinFields = [...shareDialog.querySelectorAll('.share-pin-cell')];
  const statRows = new Map();
  const traffic = new Map();
  let statsTimer = 0;
  let shareView = null;
  let cameraGeneration = 0;
  let cameraFrame = 0;

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KiB';
    return (bytes / 1048576).toFixed(1) + ' MiB';
  }

  function formatDuration(ms) {
    const seconds = Math.floor(ms / 1000);
    return seconds < 60 ? seconds + 's' : Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
  }

  function trafficSecond() { return Math.floor(performance.now() / 1000); }

  function recordTraffic(session, direction, bytes) {
    session.stats[direction] += bytes;
    const now = trafficSecond();
    if (!traffic.has(now)) {
      traffic.set(now, {rx: 0, tx: 0});
      for (const second of traffic.keys()) if (second < now - 29) traffic.delete(second);
    }
    traffic.get(now)[direction] += bytes;
  }

  function addStatsRow(session) {
    const row = document.createElement('div');
    const heading = document.createElement('div');
    const label = document.createElement('strong');
    const state = document.createElement('span');
    const qr = document.createElement('button');
    const detail = document.createElement('div');
    row.className = 'stats-session';
    heading.className = 'stats-session-title';
    state.className = 'stats-session-state';
    qr.className = 'icon-button';
    qr.type = 'button';
    qr.setAttribute('aria-label', 'Terminal sharing for session ' + session.id);
    qr.title = 'Terminal sharing';
    qr.append(controlIcon('share'));
    qr.addEventListener('click', () => openSharing(session, qr));
    detail.className = 'stats-session-detail';
    heading.append(label, state, qr);
    row.append(heading, detail);
    $('stats-sessions').append(row);
    const record = {row, label, state, qr, detail};
    statRows.set(session, record);
    return record;
  }

  function renderStats() {
    const now = trafficSecond();
    const samples = Array.from({length: 30}, (_, i) => traffic.get(now - 29 + i) || {rx: 0, tx: 0});
    const peak = Math.max(...samples.flatMap(({rx, tx}) => [rx, tx]));
    for (const direction of ['rx', 'tx']) {
      const points = samples.map((sample, index) =>
        (index ? 'L' : 'M') + (index * 10) + ' ' + (65 - sample[direction] * 64 / Math.max(1, peak)));
      $('traffic-' + direction).setAttribute('d', points.join(' '));
    }
    $('traffic-peak').textContent = '30s · ' + formatBytes(peak) + '/s peak';
    $('traffic-graph').setAttribute('aria-label', 'TTY traffic over the last 30 seconds. Latest sample received ' +
      formatBytes(samples[29].rx) + ' and sent ' + formatBytes(samples[29].tx) + '.');
    for (const [session, {row}] of statRows) {
      if (!sessions.includes(session)) {
        row.remove();
        statRows.delete(session);
      }
    }
    for (const session of sessions) {
      const {label, state, qr, detail} = statRows.get(session) || addStatsRow(session);
      label.textContent = session.tab.textContent;
      state.textContent = session.share ? permissionLabel(session.share.permissions)
        : session.shares.size ? 'Sharing · ' + session.shares.size : statusText[session.state];
      state.dataset.online = String(session.state === 'online');
      qr.hidden = session.state !== 'online';
      const {rx, tx, started, ended, handshake} = session.stats;
      const parts = ['↓ ' + formatBytes(rx), '↑ ' + formatBytes(tx)];
      if (started) parts.push(formatDuration((ended || performance.now()) - started));
      if (handshake !== undefined) parts.push(Math.round(handshake) + (session.guest ? ' ms share setup' : ' ms handshake'));
      detail.textContent = parts.join(' · ');
    }
    $('stats-empty').hidden = sessions.length !== 0;
  }

  function showStats(show, restoreFocus = false) {
    clearInterval(statsTimer);
    connectionMenu.hidden = !show;
    statusButton.setAttribute('aria-expanded', String(show));
    if (show) {
      closeFontMenu();
      renderStats();
      statsTimer = setInterval(renderStats, 1000);
      $('close-stats').focus({preventScroll: true});
    } else if (restoreFocus) {
      statusButton.focus({preventScroll: true});
    }
  }

  function showShareStatus(message = '', error = false) {
    const status = $('share-status');
    status.textContent = message;
    status.hidden = !message;
    status.dataset.error = String(error);
  }

  function canOffer(session) {
    return Boolean(session && sessions.includes(session) && !session.guest && session.shares.size < maxSharePeers
      && session.state === 'online' && session.socket?.readyState === WebSocket.OPEN);
  }

  function defaultPermissions() { return {view: true, write: false}; }

  function permissionLabel({view, write}) {
    return view ? (write ? 'View + write' : 'View only') : 'Write only';
  }

  function renderPermissions(group, permissions, disabled = false) {
    for (const button of group.querySelectorAll('button')) {
      button.setAttribute('aria-pressed', String(permissions[button.dataset.permission]));
      button.disabled = disabled;
    }
  }

  function renderSharePeers(session) {
    const list = $('share-peers');
    list.hidden = !session?.shares.size;
    list.replaceChildren(...Array.from(session?.shares || [], flow => {
      const row = document.createElement('div');
      const label = document.createElement('span');
      const revoke = document.createElement('button');
      row.className = 'share-peer';
      label.className = 'share-hint';
      label.textContent = 'Peer ' + flow.peerId + ' · ' + permissionLabel(flow.permissions);
      revoke.className = 'modal-button share-revoke';
      revoke.type = 'button';
      revoke.textContent = 'End';
      revoke.setAttribute('aria-label', 'End sharing with peer ' + flow.peerId);
      revoke.addEventListener('click', () => {
        closeShare(flow, 'Terminal sharing ended.');
        (list.querySelector('button') || $('share-generate')).focus({preventScroll: true});
      });
      row.append(label, revoke);
      return row;
    }));
  }

  function renderShare() {
    if (!shareView) return;
    const {subject, flow, tab} = shareView;
    const link = subject?.share || (flow?.approved && !flow.ended && !flow.owner ? flow : null);
    const pending = flow && !flow.ended && !flow.approved;
    const inviting = pending && flow.side === 'host';
    const awaitingApproval = inviting && Boolean(flow.pair);
    const invite = inviting && !awaitingApproval ? flow.invite : null;
    $('share-tab').setAttribute('aria-selected', String(tab === 'share'));
    $('share-connect-tab').setAttribute('aria-selected', String(tab === 'connect'));
    $('share-tab').tabIndex = tab === 'share' ? 0 : -1;
    $('share-connect-tab').tabIndex = tab === 'connect' ? 0 : -1;
    $('sharing-tabs').hidden = Boolean(link);
    $('share-panel').hidden = tab !== 'share' || Boolean(link);
    $('share-connect-panel').hidden = tab !== 'connect' || Boolean(link);
    $('share-generate').hidden = Boolean(inviting);
    $('share-generate').disabled = (subject?.shares.size || 0) >= maxSharePeers;
    $('share-generate').textContent = subject?.shares.size ? 'Invite another peer' : 'Create invite';
    $('share-invite').hidden = !invite;
    if (!invite) {
      $('share-qr').removeAttribute('src');
      $('share-pin').textContent = '';
    }
    $('share-approval').hidden = !awaitingApproval;
    const approval = $('share-approval-permissions');
    approval.hidden = !awaitingApproval || flow.mode !== 'request';
    if (!approval.hidden) renderPermissions(approval, flow.permissions);
    $('share-approve').disabled = Boolean(awaitingApproval && !sharing.hasPermissions(flow.permissions));
    $('share-stop').hidden = !link;
    renderSharePeers(subject);
    $('share-invite-hint').hidden = Boolean(inviting);
    $('share-invite-hint').textContent = $('share-generate').disabled ? 'This terminal has reached its six-peer limit.'
      : canOffer(subject) ? 'Share a terminal you’ve signed in to. Choose what the peer can do when you approve.'
        : 'Create an invite to receive a terminal from another device.';
    const joining = pending && flow.side === 'guest';
    const offering = shareMode.value === 'give';
    $('share-verify').disabled = Boolean(joining) || !sharing.parseInvite(shareLink.value)
      || !sharing.pinPattern.test(sharePinValue()) || (offering && (!canOffer(getShareSource())
        || !sharing.hasPermissions(shareView.offerPermissions)));
    $('share-verify').textContent = joining ? 'Waiting for approval…'
      : shareMode.value === 'give' ? 'Verify PIN and offer terminal' : 'Verify PIN';
    for (const control of [shareLink, shareMode, shareSource, ...sharePinFields, $('share-scan')]) {
      control.disabled = Boolean(joining);
    }
    shareSource.hidden = shareMode.value !== 'give';
    const offer = $('share-offer-permissions');
    offer.hidden = !offering;
    if (offering) renderPermissions(offer, shareView.offerPermissions, Boolean(joining));
  }

  function getShareSource() {
    return sessions.find(session => String(session.id) === shareSource.value);
  }

  function updateShareSources(subject) {
    const candidates = sessions.filter(canOffer);
    const selected = getShareSource();
    shareSource.replaceChildren(...candidates.map(session => new Option(session.tab.textContent, session.id)));
    shareSource.value = String((candidates.includes(selected) ? selected :
      candidates.includes(subject) ? subject : candidates[0])?.id || '');
    shareMode.options[1].disabled = !candidates.length;
    if (!candidates.length) shareMode.value = 'request';
  }

  function stopCamera() {
    cameraGeneration++;
    cancelAnimationFrame(cameraFrame);
    shareCamera.srcObject?.getTracks().forEach(track => track.stop());
    shareCamera.srcObject = null;
    shareCamera.hidden = true;
  }

  async function scanInvite() {
    const view = shareView;
    if (!view || view.tab !== 'connect' || view.flow) return;
    stopCamera();
    const ticket = cameraGeneration;
    showShareStatus('Waiting for camera permission…');
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false});
      if (cameraGeneration !== ticket) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }
      shareCamera.srcObject = stream;
      shareCamera.hidden = false;
      await shareCamera.play();
      if (cameraGeneration !== ticket) return;
    } catch (_) {
      if (cameraGeneration !== ticket) return;
      stopCamera();
      showShareStatus('Camera unavailable. You can paste the invite link below.', true);
      return;
    }
    showShareStatus('Point the camera at the terminal invite QR code.');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d', {willReadFrequently: true});
    let lastScan = -Infinity;
    function frame(now) {
      if (cameraGeneration !== ticket) return;
      if (shareCamera.videoWidth && now - lastScan >= 150) {
        lastScan = now;
        const scale = Math.min(1, 540 / Math.max(shareCamera.videoWidth, shareCamera.videoHeight));
        canvas.width = Math.max(1, Math.round(shareCamera.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(shareCamera.videoHeight * scale));
        context.drawImage(shareCamera, 0, 0, canvas.width, canvas.height);
        const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
        const match = window.TTYShareVendor.jsQR(pixels.data, canvas.width, canvas.height, {inversionAttempts: 'dontInvert'});
        if (match && sharing.parseInvite(match.data)) {
          shareLink.value = match.data;
          stopCamera();
          showShareStatus('Invite scanned. Choose what to share, then enter the PIN.');
          renderShare();
          if (!mobile.matches) sharePinFields[0].focus({preventScroll: true});
          return;
        }
      }
      cameraFrame = requestAnimationFrame(frame);
    }
    cameraFrame = requestAnimationFrame(frame);
  }

  function openSharing(subject, trigger, tab = 'share', invite = '') {
    if (shareDialog.open || connectDialog.open || closeDialog.open) return;
    showStats(false);
    const flow = subject?.share || null;
    shareView = {subject, trigger, tab, flow, offerPermissions: defaultPermissions()};
    shareLink.value = invite;
    clearSharePin();
    shareMode.value = 'request';
    shareSource.replaceChildren();
    updateShareSources(subject);
    showShareStatus(flow ? 'Your access is ' + permissionLabel(flow.permissions).toLowerCase() + '.' : '');
    renderShare();
    showDialog(shareDialog);
    if (invite) {
      showShareStatus('Enter the PIN from the person who created the invite.');
      if (!mobile.matches) sharePinFields[0].focus({preventScroll: true});
    } else if (tab === 'connect') scanInvite();
    else if (!flow && !subject?.shares.size && canOffer(subject)) startInvite();
  }

  function selectShareTab(tab, camera = false) {
    if (!shareView) return;
    const flow = shareView.flow;
    if (flow?.approved) return;
    if (shareView.tab !== tab) {
      shareView.flow = null;
      closeShare(flow);
      stopCamera();
      clearSharePin();
      shareView.tab = tab;
      shareView.offerPermissions = defaultPermissions();
      updateShareSources(shareView.subject);
      showShareStatus();
      renderShare();
    }
    if (camera && tab === 'connect' && !shareCamera.srcObject && !shareView.flow) scanInvite();
  }

  async function dismissSharing(restoreFocus = true) {
    if (!shareView) return;
    const {flow, trigger} = shareView;
    shareView = null;
    if (!flow?.approved) closeShare(flow);
    stopCamera();
    clearSharePin();
    shareLink.value = '';
    $('share-pin').textContent = '';
    $('share-qr').removeAttribute('src');
    await hideDialog(shareDialog);
    if (restoreFocus) (trigger?.isConnected && trigger.offsetParent ? trigger : statusButton).focus({preventScroll: true});
  }

  function closeShare(flow, message = '', notify = true) {
    if (!flow || flow.ended) return;
    flow.ended = true;
    clearInterval(flow.countdown);
    const session = flow.session;
    if (session?.share === flow) {
      session.share = null;
      clearLocalCursor(session);
      session.state = 'offline';
      session.stats.ended = performance.now();
      session.term.options.disableStdin = true;
      for (const peer of session.cursors.keys()) setPeerCursor(session, peer, null);
      session.term.writeln('\r\n' + (message || 'Terminal sharing ended.'));
      updateStatus();
    } else if (session?.shares.delete(flow)) {
      setPeerCursor(session, flow.peerId, null);
      if (flow.permissions.view) broadcastCursor(session, flow.peerId, null);
      if (!session.shares.size) clearLocalCursor(session);
      updateStatus();
    }
    if (flow.invite) flow.invite.close(message, notify);
    else flow.pair?.close(message, notify);
    if (shareView?.flow === flow || (session && shareView?.subject === session)) {
      if (shareView.flow === flow) shareView.flow = null;
      updateShareSources(shareView.subject);
      showShareStatus(message, !flow.approved && Boolean(message));
      renderShare();
    }
  }

  function stopSessionSharing(session) {
    if (session.share) closeShare(session.share, 'The terminal disconnected.');
    for (const link of session.shares) closeShare(link, 'The terminal disconnected.');
    const flow = shareView?.flow;
    if (flow?.subject === session || flow?.session === session) closeShare(flow, 'The terminal disconnected.');
  }

  function qrImage(url) {
    // Tracker's local QR renderer, using the bundled Nayuki encoder.
    const qr = qrcodegen.QrCode.encodeText(url, qrcodegen.QrCode.Ecc.MEDIUM);
    const border = 4;
    const scale = Math.max(4, Math.ceil(320 / (qr.size + border * 2)));
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = (qr.size + border * 2) * scale;
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = '#000';
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.getModule(x, y)) context.fillRect((x + border) * scale, (y + border) * scale, scale, scale);
      }
    }
    return canvas.toDataURL('image/png');
  }

  async function startInvite() {
    if (!shareView || shareView.flow) return;
    const flow = {side: 'host', subject: canOffer(shareView.subject) ? shareView.subject : null};
    shareView.flow = flow;
    showShareStatus('Creating a one-time invite…');
    renderShare();
    try {
      const invite = await sharing.createInvite({
        onRequest: (mode, permissions, pair, allow) => {
          if (flow.ended || shareView?.flow !== flow) {
            pair.close('The invite was cancelled.');
            return;
          }
          flow.pair = pair;
          flow.mode = mode;
          flow.permissions = permissions || defaultPermissions();
          flow.allow = allow;
          if (mode === 'request' && !canOffer(flow.subject)) {
            closeShare(flow, 'This invite can receive a terminal only.');
            return;
          }
          $('share-approval-detail').textContent = mode === 'request'
            ? 'PIN verified. Choose what this peer can do in session ' + flow.subject.id + '.'
            : 'PIN verified. This peer is offering ' + permissionLabel(permissions).toLowerCase() + ' access.';
          $('share-approve').textContent = mode === 'request' ? 'Approve and share' : 'Accept terminal';
          showShareStatus();
          renderShare();
          $('share-decline').focus({preventScroll: true});
        },
        onPacket: (type, bytes) => receiveShared(flow, type, bytes),
        onClose: message => closeShare(flow, message, false)
      });
      if (flow.ended || shareView?.flow !== flow) {
        invite.close('');
        return;
      }
      flow.invite = invite;
      if (!flow.pair) {
        $('share-qr').src = qrImage(invite.url);
        $('share-pin').textContent = invite.pin;
        showShareStatus();
      }
      function countdown() {
        const remaining = Math.max(0, Math.ceil((invite.expires - Date.now()) / 1000));
        $('share-expiry').textContent = 'One use · expires in ' + remaining + 's';
      }
      countdown();
      flow.countdown = setInterval(countdown, 1000);
      renderShare();
    } catch (_) {
      closeShare(flow, 'Couldn’t create an invite. Check your network and try again.');
    }
  }

  async function requestShare(event) {
    event.preventDefault();
    if ($('share-verify').disabled || !shareView || shareView.flow) return;
    const invite = sharing.parseInvite(shareLink.value);
    const pin = sharePinValue();
    const offering = shareMode.value === 'give';
    const flow = {side: 'guest', mode: shareMode.value, started: performance.now(),
      subject: offering ? getShareSource() : null, permissions: offering ? {...shareView.offerPermissions} : null};
    if (!invite || !sharing.pinPattern.test(pin) || (flow.mode === 'give' && !canOffer(flow.subject))) return;
    shareView.flow = flow;
    stopCamera();
    clearSharePin();
    showShareStatus('Checking the PIN. The other person must also approve.');
    renderShare();
    try {
      const pair = await sharing.joinInvite(invite, pin, flow.mode, flow.permissions, {
        onReady: readyPair => {
          if (flow.ended || shareView?.flow !== flow) {
            readyPair.close('The request was cancelled.');
            return;
          }
          flow.pair = readyPair;
          if (flow.mode === 'give' && !canOffer(flow.subject)) {
            closeShare(flow, 'The terminal is no longer available.');
            return;
          }
          activateShare(flow, flow.mode === 'give');
        },
        onPacket: (type, bytes) => receiveShared(flow, type, bytes),
        onClose: message => closeShare(flow, message, false)
      });
      if (flow.ended) pair.close('');
      else flow.pair = pair;
    } catch (_) {
      closeShare(flow, 'Couldn’t connect to the invite. Check the link and try again.');
    }
  }

  function approveShare() {
    const flow = shareView?.flow;
    if (!flow?.allow || flow.approved || flow.ended || !sharing.hasPermissions(flow.permissions)) return;
    if (flow.mode === 'request' && !canOffer(flow.subject)) {
      closeShare(flow, 'The terminal is no longer available.');
      return;
    }
    if (flow.allow()) activateShare(flow, flow.mode === 'request');
  }

  function activateShare(flow, owner) {
    flow.approved = true;
    flow.owner = owner;
    clearInterval(flow.countdown);
    if (owner) {
      const session = flow.subject;
      flow.session = session;
      flow.peerId = session.nextPeer++;
      session.shares.add(flow);
      shareView.flow = null;
      shareView.subject = session;
      shareView.tab = 'share';
      showShareStatus('Peer ' + flow.peerId + ' connected.');
      queueShareScreen(flow);
    } else {
      showShareStatus('Opening the shared terminal…');
    }
    renderShare();
    updateStatus();
  }

  function queueShareScreen(flow) {
    if (flow.ended || flow.initialOutput) return;
    const {term, serializer, user} = flow.session;
    flow.initialOutput = [];
    flow.initialBytes = 0;
    term.write('', () => {
      if (flow.ended) return;
      try {
        let screen = null;
        if (flow.permissions.view) {
          flow.capturedAlternate = term.buffer.active.type === 'alternate';
          screen = serializer.serialize({scrollback: 0});
          if (flow.capturedAlternate) {
            // The serializer prefixes the hidden normal buffer. Strip it before sending.
            const hidden = serializer.serialize({scrollback: 0, excludeAltBuffer: true, excludeModes: true});
            screen = screen.slice(hidden.length);
          }
        }
        flow.pair.send(shareTypes.screen, sharing.pack({cols: term.cols, rows: term.rows, user, screen,
          permissions: flow.permissions, peerId: flow.peerId}));
        if (!flow.screenSent && flow.permissions.view) sendCursorSnapshot(flow);
        flow.screenSent = true;
        for (const bytes of flow.initialOutput) sendSharedBytes(flow, shareTypes.output, bytes);
        flow.initialOutput = null;
      } catch (_) {
        closeShare(flow, 'Couldn’t capture the terminal screen.');
      }
    });
  }

  function readSharedSize(bytes) {
    const size = sharing.unpack(bytes);
    if (!Number.isInteger(size.cols) || size.cols < 1 || size.cols > 1024
        || !Number.isInteger(size.rows) || size.rows < 1 || size.rows > 512
        || size.cols * size.rows > 65536) throw new Error('Invalid shared terminal size');
    return size;
  }

  function resizeGuest(session, {cols, rows}) {
    session.term.resize(cols, rows);
    sizeGuestFrame(session);
  }

  function sizeGuestFrame(session) {
    if (!session.guest || !session.term.element) return;
    const screen = session.term.element.querySelector('.xterm-screen');
    session.content.style.inlineSize = screen.style.width;
    session.content.style.blockSize = screen.style.height;
  }

  function writeGuestScreen(session, bytes, size) {
    const length = bytes.length;
    session.guestWrite += length;
    if (session.guestWrite > 1048576) {
      closeShare(session.share, 'The shared terminal received too much output.');
      return;
    }
    session.term.write(bytes, () => {
      session.guestWrite -= length;
      if (size && session.share) resizeGuest(session, size);
    });
  }

  function receiveShared(flow, type, bytes) {
    if (!flow.approved || flow.ended) return;
    const session = flow.session;
    if (type === shareTypes.cursor) {
      if (flow.permissions?.view && flow.screenSent) receiveCursor(flow, bytes);
      return;
    }
    if (flow.owner) {
      if (type === shareTypes.input && flow.permissions.write && session.shares.has(flow) && bytes.length <= 65536) {
        if (session.socket?.bufferedAmount > 1048576) {
          closeShare(flow, 'The terminal cannot keep up with shared input.');
          return;
        }
        writeBytes(session, bytes);
      }
      return;
    }
    if (type === shareTypes.screen) {
      const {screen, user, cols, rows, permissions, peerId} = readSharedSize(bytes);
      if (!sharing.hasPermissions(permissions) || (permissions.view ? typeof screen !== 'string' : screen !== null)
          || typeof user !== 'string' || !sshUser.test(user) || !validPeerId(peerId) || !peerId
          || (flow.peerId && flow.peerId !== peerId)
          || (flow.permissions && (flow.permissions.view !== permissions.view || flow.permissions.write !== permissions.write))) {
        closeShare(flow, 'Invalid shared terminal screen.');
        return;
      }
      flow.permissions = permissions;
      flow.peerId = peerId;
      flow.screenSent = true;
      if (session) {
        resizeGuest(session, {cols, rows});
        if (permissions.view) writeGuestScreen(session, '\x1bc' + screen);
        return;
      }
      const guest = addSession(user, '', null, true);
      if (sessions.length === 1) toggleSidebar(true);
      nextSession++;
      guest.share = flow;
      guest.state = 'online';
      guest.stats.started = performance.now();
      if (flow.started) guest.stats.handshake = guest.stats.started - flow.started;
      flow.session = guest;
      guest.term.options.disableStdin = !permissions.write;
      guest.term.textarea.readOnly = !permissions.write;
      resizeGuest(guest, {cols, rows});
      if (permissions.view) writeGuestScreen(guest, screen);
      else guest.term.writeln('Write-only terminal. Input is sent without showing output.');
      updateStatus();
      dismissSharing(false).then(() => { if (!mobile.matches && active === guest) guest.term.focus(); });
    } else if (session && type === shareTypes.output && flow.permissions.view) {
      recordTraffic(session, 'rx', bytes.length);
      writeGuestScreen(session, bytes);
    } else if (session && type === shareTypes.resize) {
      const size = readSharedSize(bytes);
      // Queue the resize behind bytes rendered at the previous dimensions.
      session.term.write('', () => { if (session.share === flow) resizeGuest(session, size); });
    } else if (type === shareTypes.output || type === shareTypes.resize) {
      closeShare(flow, 'The shared terminal screen was missing.');
    }
  }

  function sendSharedBytes(flow, type, bytes) {
    for (let offset = 0; offset < bytes.length && !flow.ended; offset += 32768) {
      flow.pair.send(type, bytes.subarray(offset, offset + 32768));
    }
  }

  function mirrorShareOutput(flow, bytes) {
    if (!flow.permissions.view || flow.ended) return;
    if (flow.initialOutput) {
      flow.initialBytes += bytes.length;
      if (flow.initialBytes > 1048576) closeShare(flow, 'The terminal changed too quickly to share.');
      else flow.initialOutput.push(bytes);
    } else {
      sendSharedBytes(flow, shareTypes.output, bytes);
    }
  }

  const cursorColors = ['#a7edc1', '#a5d8ff', '#ffcba7', '#e0c5ff', '#ffe48a', '#ffb7cc', '#b9e8e8'];
  const cursorInterval = 40;

  function validPeerId(value) { return Number.isSafeInteger(value) && value >= 0; }

  function validCursor(position) {
    return position === null || (Array.isArray(position) && position.length === 2 &&
      position.every(coordinate => Number.isFinite(coordinate) && coordinate >= 0 && coordinate <= 1));
  }

  function setPeerCursor(session, peer, position) {
    const existing = session.cursors.get(peer);
    if (!position) {
      if (existing) {
        existing.element.remove();
        session.cursors.delete(peer);
      }
      return;
    }
    if (!existing && session.cursors.size >= maxSharePeers) return;
    let element = existing?.element;
    if (!element) {
      element = document.createElement('span');
      const name = document.createElement('span');
      element.className = 'peer-cursor';
      element.dataset.peer = String(peer);
      element.style.setProperty('--peer-color', cursorColors[peer % cursorColors.length]);
      name.textContent = peer ? 'Peer ' + peer : 'Owner';
      element.append(controlIcon('pointer'), name);
      session.cursorLayer.append(element);
    }
    element.style.left = (position[0] * 100) + '%';
    element.style.top = (position[1] * 100) + '%';
    session.cursors.set(peer, {element, position});
  }

  function broadcastCursor(session, peer, position) {
    const message = sharing.pack({peer, position});
    for (const flow of session.shares) {
      if (flow.screenSent && flow.permissions.view && flow.peerId !== peer) flow.pair.send(shareTypes.cursor, message);
    }
  }

  function sendCursorSnapshot(flow) {
    const session = flow.session;
    if (session.localCursor) flow.pair.send(shareTypes.cursor, sharing.pack({peer: 0, position: session.localCursor}));
    for (const [peer, {position}] of session.cursors) {
      if (peer !== flow.peerId) flow.pair.send(shareTypes.cursor, sharing.pack({peer, position}));
    }
  }

  function receiveCursor(flow, bytes) {
    if (bytes.length > 160) return;
    const message = sharing.unpack(bytes);
    if (!message || !validCursor(message.position)) return;
    const {position} = message;
    const {session} = flow;
    if (flow.owner) {
      const now = performance.now();
      if (position) {
        if (now - (flow.lastCursor ?? -Infinity) < cursorInterval * .75) return;
        flow.lastCursor = now;
      } else if (!session.cursors.has(flow.peerId)) {
        return;
      }
      setPeerCursor(session, flow.peerId, position);
      broadcastCursor(session, flow.peerId, position);
    } else if (validPeerId(message.peer) && message.peer !== flow.peerId) {
      setPeerCursor(session, message.peer, position);
    }
  }

  function publishLocalCursor(session, position) {
    if (!position && !session.localCursor) return;
    session.localCursor = position;
    if (!session.guest) broadcastCursor(session, 0, position);
    else if (session.share?.permissions.view) session.share.pair.send(shareTypes.cursor, sharing.pack({position}));
  }

  function clearLocalCursor(session) {
    clearTimeout(session.cursorTimer);
    session.cursorTimer = 0;
    publishLocalCursor(session, null);
  }

  function wireSessionCursor(session) {
    const {content, term, cursorLayer} = session;
    const screen = term.element.querySelector('.xterm-screen');
    function sizeCursorLayer() {
      cursorLayer.style.inlineSize = screen.style.width;
      cursorLayer.style.blockSize = screen.style.height;
    }
    function move(event) {
      const visible = session.shares.size || session.share?.permissions.view;
      if (!visible) return;
      const bounds = screen.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      const relative = [(event.clientX - bounds.left) / bounds.width, (event.clientY - bounds.top) / bounds.height];
      if (!validCursor(relative)) {
        clearLocalCursor(session);
        return;
      }
      session.pendingCursor = relative.map(coordinate => Math.round(coordinate * 1000) / 1000);
      if (session.cursorTimer) return;
      session.cursorTimer = setTimeout(() => {
        session.cursorTimer = 0;
        publishLocalCursor(session, session.pendingCursor);
      }, cursorInterval);
    }
    term.onRender(sizeCursorLayer);
    sizeCursorLayer();
    content.addEventListener('pointermove', move);
    content.addEventListener('pointerdown', move);
    for (const event of ['pointerleave', 'pointercancel']) content.addEventListener(event, () => clearLocalCursor(session));
    content.addEventListener('pointerup', event => { if (event.pointerType === 'touch') clearLocalCursor(session); });
  }

  function sharePinValue() {
    return sharePinFields.map(field => field.value).join('');
  }

  function clearSharePin() {
    for (const field of sharePinFields) field.value = '';
  }

  function pinCharacters(value) {
    return [...value.replace(/[^a-z0-9]/gi, '').toUpperCase()].filter(char => sharing.pinAlphabet.includes(char));
  }

  function updateShareForm() {
    showShareStatus();
    renderShare();
  }

  function wireSharePin() {
    const last = sharePinFields.length - 1;
    const focus = index => sharePinFields[Math.min(index, last)].focus({preventScroll: true});
    sharePinFields.forEach((field, index) => {
      function erase(event) {
        event.preventDefault();
        const target = field.value ? index : Math.max(0, index - 1);
        sharePinFields[target].value = '';
        focus(target);
        updateShareForm();
      }

      field.addEventListener('focus', () => field.select());
      field.addEventListener('click', () => field.select());
      field.addEventListener('input', event => {
        if (event.isComposing) return;
        field.value = pinCharacters(field.value)[0] || '';
        if (field.value) focus(index + 1);
      });
      field.addEventListener('keydown', event => {
        if (!event.isComposing && (event.key === 'Backspace' || event.key === 'Delete')) erase(event);
      });
      field.addEventListener('beforeinput', event => {
        if (event.cancelable && /^deleteContent(?:Backward|Forward)$/.test(event.inputType)) erase(event);
      });
      field.addEventListener('paste', event => {
        event.preventDefault();
        const chars = pinCharacters(event.clipboardData?.getData('text') || '');
        if (!chars.length || chars.length > sharePinFields.length) return;
        const start = chars.length === sharePinFields.length ? 0 : index;
        const count = Math.min(chars.length, sharePinFields.length - start);
        for (let offset = 0; offset < count; offset++) sharePinFields[start + offset].value = chars[offset];
        focus(start + count);
        updateShareForm();
      });
    });
  }

  function wireSharing() {
    statusButton.addEventListener('click', () => showStats(connectionMenu.hidden));
    $('close-stats').addEventListener('click', () => showStats(false, true));
    $('stats-connect').addEventListener('click', () => {
      showStats(false);
      openConnect(active?.state === 'offline' && !active.guest ? active : null);
    });
    $('stats-scan').addEventListener('click', () => openSharing(active, statusButton, 'connect'));
    dismissOnOutside(shareDialog, () => dismissSharing());
    $('share-close').addEventListener('click', () => dismissSharing());
    $('share-tab').addEventListener('click', () => selectShareTab('share'));
    $('share-connect-tab').addEventListener('click', () => selectShareTab('connect', true));
    document.querySelector('.share-tabs').addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const tab = event.key === 'Home' ? 'share' : event.key === 'End' ? 'connect'
        : shareView?.tab === 'share' ? 'connect' : 'share';
      selectShareTab(tab, true);
      $(tab === 'share' ? 'share-tab' : 'share-connect-tab').focus();
    });
    $('share-scan').addEventListener('click', scanInvite);
    $('share-generate').addEventListener('click', startInvite);
    for (const [id, getPermissions] of [
      ['share-approval-permissions', () => shareView?.flow?.permissions],
      ['share-offer-permissions', () => shareView?.offerPermissions]
    ]) {
      $(id).addEventListener('click', event => {
        const button = event.target.closest('button[data-permission]');
        const permissions = getPermissions();
        if (!button || !permissions) return;
        const key = button.dataset.permission;
        permissions[key] = !permissions[key];
        renderShare();
      });
    }
    $('share-cancel').addEventListener('click', () => closeShare(shareView?.flow));
    $('share-decline').addEventListener('click', () => closeShare(shareView?.flow, 'Request declined.'));
    $('share-approve').addEventListener('click', approveShare);
    $('share-stop').addEventListener('click', () => {
      closeShare(shareView?.subject?.share || shareView?.flow, 'Terminal sharing ended.');
    });
    $('share-copy').addEventListener('click', async () => {
      const invite = shareView?.flow?.invite;
      if (!invite) return;
      try {
        await navigator.clipboard.writeText(invite.url);
        if (shareView?.flow?.invite === invite) showShareStatus('Invite link copied.');
      } catch (_) {
        if (shareView?.flow?.invite === invite) showShareStatus('Copy failed. Scan the QR code instead.', true);
      }
    });
    $('share-join').addEventListener('submit', requestShare);
    $('share-join').addEventListener('input', updateShareForm);
    wireSharePin();
    document.addEventListener('pointerdown', event => {
      if (!connectionMenu.hidden && !connectionMenu.contains(event.target) && !statusButton.contains(event.target)) {
        showStats(false);
      }
    }, true);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !connectionMenu.hidden) {
        event.preventDefault();
        showStats(false, true);
      }
    });
  }

  function parseLink(value) {
    const raw = value.trim();
    if (!raw) return null;
    try {
      const url = new URL(/^[a-z]+:\/\//i.test(raw) ? raw : 'https://' + raw);
      if (!['https:', 'wss:'].includes(url.protocol) || url.port || url.username || url.password) return null;
      if (!tunnelHost.test(url.hostname)) return null;
      const fragment = new URLSearchParams(url.hash.slice(1));
      const token = fragment.get('tty') || fragment.get('token') || '';
      return tunnelToken.test(token) ? {host: url.hostname, token} : null;
    } catch (_) {
      return null;
    }
  }

  function readRecents() {
    try {
      const records = JSON.parse(localStorage.getItem(recentKey));
      if (!Array.isArray(records)) return [];
      return records.filter(entry => entry && typeof entry.link === 'string' && parseLink(entry.link)
        && typeof entry.user === 'string' && sshUser.test(entry.user)).slice(0, recentLimit);
    } catch (_) {
      return recentSessions;
    }
  }

  function storeRecents(records) {
    recentSessions = records;
    try {
      if (records.length) localStorage.setItem(recentKey, JSON.stringify(records));
      else localStorage.removeItem(recentKey);
    } catch (_) {}
  }

  function rememberRecent(link, user) {
    const host = parseLink(link).host;
    const remaining = readRecents().filter(entry => entry.user !== user || parseLink(entry.link).host !== host);
    storeRecents([{link, user}, ...remaining].slice(0, recentLimit));
  }

  function fillRecent(entry) {
    endpoint.value = entry.link;
    username.value = entry.user;
    reportConnectError('');
    toggleRecents(false);
    renderForm();
    connectButton.focus({preventScroll: true});
  }

  function renderRecents() {
    recentSessions = readRecents();
    const buttons = recentSessions.map(entry => {
      const button = document.createElement('button');
      const name = document.createElement('span');
      const host = document.createElement('span');
      button.type = 'button';
      button.className = 'recent-item';
      name.textContent = entry.user;
      host.className = 'recent-host';
      host.textContent = parseLink(entry.link).host;
      button.append(name, host);
      button.addEventListener('click', () => fillRecent(entry));
      return button;
    });
    $('recent-items').replaceChildren(...buttons);
    $('recent-empty').hidden = buttons.length > 0;
    clearRecents.hidden = buttons.length === 0;
  }

  function toggleRecents(open) {
    if (open) renderRecents();
    recentList.hidden = !open;
    recentToggle.setAttribute('aria-expanded', String(open));
    positionConnectPanel();
  }

  function updateStatus() {
    const state = active?.state || 'offline';
    const label = statusText[state];
    statusButton.firstElementChild.dataset.state = state;
    statusButton.setAttribute('aria-label', label + '. Open connection statistics');
    statusButton.title = label + ' · Connection statistics';
    for (const session of sessions) {
      session.shareButton.hidden = session.state !== 'online';
      session.forkButton.hidden = session.guest || !session.host || session.state === 'connecting';
      session.shareButton.dataset.shared = String(Boolean(session.share || session.shares.size));
    }
    if (!connectionMenu.hidden) renderStats();
  }

  function live(message) {
    $('announcement').textContent = message;
  }

  function clearModifiers() {
    for (const [key, button] of modifierButtons) {
      modifiers[key] = false;
      button.setAttribute('aria-pressed', 'false');
    }
  }

  function fitTerminal(session = active) {
    if (!visiblePanes.has(session)) return;
    const {term, fit, socket} = session;
    if (session.guest) {
      sizeGuestFrame(session);
      return;
    }
    fit.fit();
    if (session.state !== 'online' || socket?.readyState !== WebSocket.OPEN) return;
    const size = term.cols + 'x' + term.rows;
    if (size !== session.lastSize) {
      socket.send(JSON.stringify({type: 'resize', cols: term.cols, rows: term.rows}));
      session.lastSize = size;
      const dimensions = sharing.pack({cols: term.cols, rows: term.rows});
      for (const flow of session.shares) {
        if (flow.screenSent && !flow.initialOutput) flow.pair.send(shareTypes.resize, dimensions);
      }
    }
  }

  function scheduleFit() {
    if (fitFrame) return;
    fitFrame = requestAnimationFrame(() => {
      fitFrame = 0;
      for (const session of visiblePanes.keys()) fitTerminal(session);
      positionFontMenu();
    });
  }

  function positionFontMenu() {
    if (!fontSession) return;
    const viewport = window.visualViewport;
    const left = viewport?.offsetLeft ?? 0;
    const top = viewport?.offsetTop ?? 0;
    const right = left + (viewport?.width ?? innerWidth);
    const bottom = app.getBoundingClientRect().bottom;
    const anchor = fontSession.paneLabel.getBoundingClientRect();
    const maxTop = bottom - fontMenu.offsetHeight - 6;
    const below = anchor.bottom + 3;
    const preferredTop = below <= maxTop ? below : anchor.top - fontMenu.offsetHeight - 3;
    fontMenu.style.left = Math.max(left + 6, Math.min(anchor.left, right - fontMenu.offsetWidth - 6)) + 'px';
    fontMenu.style.top = Math.max(top + 6, Math.min(preferredTop, maxTop)) + 'px';
  }

  function closeFontMenu(restoreFocus = false) {
    if (!fontSession) return;
    const trigger = fontSession.paneLabel;
    fontSession = null;
    trigger.setAttribute('aria-expanded', 'false');
    fontMenu.hidden = true;
    if (restoreFocus) trigger.focus({preventScroll: true});
  }

  function updateFontMenu() {
    const size = fontSession.term.options.fontSize;
    $('pane-font-value').textContent = size + ' px';
    smallerFont.disabled = size <= minFontSize;
    largerFont.disabled = size >= maxFontSize;
  }

  function toggleFontMenu(session) {
    if (fontSession === session) {
      closeFontMenu();
      return;
    }
    closeFontMenu();
    setActive(session);
    fontSession = session;
    session.paneLabel.setAttribute('aria-expanded', 'true');
    updateFontMenu();
    fontMenu.hidden = false;
    positionFontMenu();
    (smallerFont.disabled ? largerFont : smallerFont).focus({preventScroll: true});
  }

  function changeFontSize(delta) {
    if (!fontSession) return;
    const options = fontSession.term.options;
    options.fontSize = Math.min(maxFontSize, Math.max(minFontSize, options.fontSize + delta));
    const button = document.activeElement;
    updateFontMenu();
    if (button === smallerFont && smallerFont.disabled) largerFont.focus({preventScroll: true});
    if (button === largerFont && largerFont.disabled) smallerFont.focus({preventScroll: true});
    scheduleFit();
  }

  function showTouchClose(row = null) {
    if (touchCloseRow) delete touchCloseRow.dataset.touchClose;
    touchCloseRow = row;
    if (row) row.dataset.touchClose = 'true';
  }

  function isSplit(node) { return Boolean(node?.axis); }

  function firstPane(node) {
    return isSplit(node) ? firstPane(node.first) : node;
  }

  function replacePane(node, session, replacement) {
    if (!isSplit(node)) return node === session ? replacement : node;
    const first = replacePane(node.first, session, replacement);
    const second = replacePane(node.second, session, replacement);
    if (!first || !second) return first || second;
    return {...node, first, second};
  }

  function makeDivider(split, element) {
    const divider = document.createElement('div');
    const row = split.axis === 'row';
    divider.className = 'pane-divider';
    divider.tabIndex = 0;
    divider.setAttribute('role', 'separator');
    divider.setAttribute('aria-label', 'Resize terminal panes');
    divider.setAttribute('aria-orientation', row ? 'vertical' : 'horizontal');

    function setRatio(value) {
      const span = row ? element.clientWidth : element.clientHeight;
      const minimum = Math.min(.35, 82 / Math.max(1, span - dividerSize));
      split.ratio = Math.max(minimum, Math.min(1 - minimum, value));
      element.style.setProperty('--first', split.ratio + 'fr');
      element.style.setProperty('--second', (1 - split.ratio) + 'fr');
      divider.setAttribute('aria-valuemin', String(Math.round(minimum * 100)));
      divider.setAttribute('aria-valuemax', String(Math.round((1 - minimum) * 100)));
      divider.setAttribute('aria-valuenow', String(Math.round(split.ratio * 100)));
      scheduleFit();
    }

    element.style.setProperty('--first', split.ratio + 'fr');
    element.style.setProperty('--second', (1 - split.ratio) + 'fr');
    divider.setAttribute('aria-valuenow', String(Math.round(split.ratio * 100)));
    divider.addEventListener('pointerdown', event => {
      if (event.button !== 0 || !event.isPrimary) return;
      event.preventDefault();
      divider.setPointerCapture(event.pointerId);
      divider.dataset.resizing = 'true';
    });
    divider.addEventListener('pointermove', event => {
      if (!divider.hasPointerCapture(event.pointerId)) return;
      const bounds = element.getBoundingClientRect();
      const coordinate = row ? event.clientX - bounds.left : event.clientY - bounds.top;
      const span = row ? bounds.width : bounds.height;
      setRatio((coordinate - dividerSize / 2) / Math.max(1, span - dividerSize));
    });
    divider.addEventListener('lostpointercapture', () => { delete divider.dataset.resizing; });
    divider.addEventListener('keydown', event => {
      const negative = row ? 'ArrowLeft' : 'ArrowUp';
      const positive = row ? 'ArrowRight' : 'ArrowDown';
      if (![negative, positive].includes(event.key)) return;
      event.preventDefault();
      setRatio(split.ratio + (event.key === negative ? -1 : 1) * (event.shiftKey ? .12 : .04));
    });
    return divider;
  }

  function renderPanes() {
    closeFontMenu();
    visiblePanes.clear();
    function build(node, parentAxis = null) {
      if (!isSplit(node)) {
        visiblePanes.set(node, parentAxis);
        node.panel.setAttribute('role', parentAxis ? 'region' : 'tabpanel');
        return node.panel;
      }
      const element = document.createElement('div');
      element.className = 'pane-split';
      element.dataset.axis = node.axis;
      element.append(build(node.first, node.axis), makeDivider(node, element), build(node.second, node.axis));
      return element;
    }
    paneArea.replaceChildren(...(paneLayout ? [build(paneLayout)] : []));
    scheduleFit();
  }

  function setActive(session, focus = false) {
    if (active !== session) clearModifiers();
    if (session && !visiblePanes.has(session)) {
      paneLayout = paneLayout ? replacePane(paneLayout, active || firstPane(paneLayout), session) : session;
      renderPanes();
    }
    active = session;
    for (const item of sessions) {
      const selected = item === active;
      item.row.dataset.selected = String(selected);
      item.tab.setAttribute('aria-selected', String(selected));
      item.tab.tabIndex = selected || (!active && item === sessions[0]) ? 0 : -1;
      item.close.tabIndex = selected ? 0 : -1;
      item.panel.dataset.active = String(selected);
    }
    if (session && focus && (!mobile.matches || keyboardOpen)) session.term.focus();
    updateStatus();
    updateViewport();
    scheduleFit();
  }

  function minimizePane(session) {
    clearLocalCursor(session);
    paneLayout = replacePane(paneLayout, session, null);
    renderPanes();
    if (active === session) {
      const next = firstPane(paneLayout);
      setActive(next, true);
      if (!next) (sidebarOpen ? session.tab : sidebarToggle).focus({preventScroll: true});
    }
  }

  function dockSession(session, target, axis, insertFirst, focus = true) {
    if (session === target) return;
    paneLayout = replacePane(paneLayout, session, null);
    const split = {axis, ratio: .5,
      first: insertFirst ? session : target, second: insertFirst ? target : session};
    paneLayout = replacePane(paneLayout, target, split);
    renderPanes();
    setActive(session, focus);
  }

  function dockRegions(source) {
    const layout = visiblePanes.has(source) ? replacePane(paneLayout, source, null) : paneLayout;
    const regions = [];
    function visit(node, left, top, width, height, parentAxis = null) {
      if (!isSplit(node)) {
        regions.push({target: node, parentAxis, left, top, width, height});
        return;
      }
      const row = node.axis === 'row';
      const span = Math.max(0, (row ? width : height) - dividerSize);
      const first = span * node.ratio;
      const second = span - first;
      visit(node.first, left, top, row ? first : width, row ? height : first, node.axis);
      visit(node.second, left + (row ? first + dividerSize : 0), top + (row ? 0 : first + dividerSize),
        row ? second : width, row ? height : second, node.axis);
    }
    const base = terminals.getBoundingClientRect();
    if (layout) visit(layout, base.left, base.top, base.width, base.height);
    else if (!source) visit(null, base.left, base.top, base.width, base.height);
    return regions;
  }

  function dockPosition(session, x, y) {
    const regions = dockRegions(session);
    for (const rect of regions) {
      if (!rect.width || !rect.height || x < rect.left || x > rect.left + rect.width
          || y < rect.top || y > rect.top + rect.height) continue;
      if (!rect.target) return {target: null, axis: null, first: true, regions};
      const across = (x - rect.left) / rect.width;
      const down = (y - rect.top) / rect.height;
      const axis = rect.parentAxis ? (rect.parentAxis === 'row' ? 'column' : 'row')
        : (Math.abs(across - .5) >= Math.abs(down - .5) ? 'row' : 'column');
      return {target: rect.target, axis, first: (axis === 'row' ? across : down) < .5, regions};
    }
    return null;
  }

  function previewDock(position) {
    dockTargets.hidden = !position;
    dockTargets.replaceChildren();
    if (!position) return;
    const base = terminals.getBoundingClientRect();
    for (const rect of position.regions) {
      const axis = rect.parentAxis ? (rect.parentAxis === 'row' ? 'column' : 'row') : position.axis;
      const row = axis === 'row';
      const width = row ? rect.width / 2 : rect.width;
      const height = axis === 'column' ? rect.height / 2 : rect.height;
      for (const first of axis ? [true, false] : [true]) {
        const zone = document.createElement('div');
        zone.className = 'dock-target';
        zone.dataset.highlight = String(rect.target === position.target && first === position.first);
        const x = rect.left - base.left + (!first && row ? width : 0);
        const y = rect.top - base.top + (!first && !row ? height : 0);
        Object.assign(zone.style, {
          left: x + 3 + 'px', top: y + 3 + 'px', width: Math.max(0, width - 6) + 'px',
          height: Math.max(0, height - 6) + 'px'
        });
        dockTargets.append(zone);
      }
    }
  }

  const sidebarTrash = $('sidebar-trash');

  function overTrash(event) {
    if (sidebarTrash.hidden) return false;
    const box = sidebarTrash.getBoundingClientRect();
    return event.clientX >= box.left - 6 && event.clientX <= box.right + 6
      && event.clientY >= box.top - 8 && event.clientY <= box.bottom + 8;
  }

  function beginDrag(event, session, fromSidebar = false) {
    if (event.button !== 0 || !event.isPrimary) return;
    drag = {session, pointer: event.pointerId, x: event.clientX, y: event.clientY,
      handle: session ? event.target : addButton, moved: false, position: null, fromSidebar};
  }

  function moveDrag(event) {
    if (!drag || drag.pointer !== event.pointerId) return;
    if (!drag.moved && Math.hypot(drag.x - event.clientX, drag.y - event.clientY) < 6) return;
    if (!drag.moved) {
      closeFontMenu();
      if (drag.fromSidebar) {
        sidebarTrash.hidden = false;
        drag.session.row.dataset.dragged = 'true';
      }
    }
    drag.moved = true;
    app.dataset.dragging = 'true';
    if (event.cancelable) event.preventDefault();
    const trash = drag.fromSidebar && overTrash(event);
    sidebarTrash.dataset.over = String(trash);
    const position = trash ? null : dockPosition(drag.session, event.clientX, event.clientY);
    if (position?.target !== drag.position?.target || position?.axis !== drag.position?.axis
        || position?.first !== drag.position?.first) {
      drag.position = position;
      previewDock(position);
    }
  }

  function finishDrag(event) {
    if (!drag || drag.pointer !== event.pointerId) return;
    const {session, moved, handle, fromSidebar} = drag;
    const trash = fromSidebar && moved && event.type === 'pointerup' && overTrash(event);
    drag = null;
    delete app.dataset.dragging;
    if (session) delete session.row.dataset.dragged;
    sidebarTrash.hidden = true;
    sidebarTrash.dataset.over = 'false';
    dockTargets.hidden = true;
    if (!moved) return;
    suppressClick = handle;
    setTimeout(() => { if (suppressClick === handle) suppressClick = null; }, 80);
    if (trash) {
      session.requestClose();
      return;
    }
    const position = event.type === 'pointerup' && dockPosition(session, event.clientX, event.clientY);
    if (!position) return;
    if (session) dockSession(session, position.target, position.axis, position.first);
    else openConnect(null, true, position);
  }

  function toggleSidebar(open) {
    sidebarOpen = open;
    sidebar.inert = !open;
    if (!open) showTouchClose();
    app.dataset.sidebarOpen = String(open);
    sidebarToggle.setAttribute('aria-expanded', String(open));
    const action = open ? 'Hide sessions' : 'Show sessions';
    sidebarToggle.setAttribute('aria-label', action);
    sidebarToggle.title = action;
    scheduleFit();
  }

  function controlIcon(name) {
    const namespace = 'http://www.w3.org/2000/svg';
    const icon = document.createElementNS(namespace, 'svg');
    const use = document.createElementNS(namespace, 'use');
