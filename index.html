    icon.classList.add('control-icon');
    icon.setAttribute('viewBox', '0 0 16 16');
    icon.setAttribute('aria-hidden', 'true');
    use.setAttribute('href', '#icon-' + name);
    icon.append(use);
    return icon;
  }

  function writeBytes(session, bytes) {
    if (!bytes.length) return;
    if (session.state === 'reconnecting' && session.resume) {
      // Queue keystrokes while the network changes; they're resent after resume.
      trackInput(session, bytes);
    } else if (session.state !== 'online') {
      return;
    } else if (session.guest) {
      if (!session.share?.permissions.write) return;
      sendSharedBytes(session.share, shareTypes.input, bytes);
    } else if (session.socket?.readyState === WebSocket.OPEN) {
      session.socket.send(bytes);
      trackInput(session, bytes);
    } else {
      return;
    }
    recordTraffic(session, 'tx', bytes.length);
  }

  function changeSessionLabel(session, user, host) {
    session.user = user;
    session.host = host;
    session.tab.textContent = session.qtty || user;
    session.paneLabel.textContent = session.id + ' ' + user + (session.qtty ? ' · ' + session.qtty : '');
    session.paneLabel.setAttribute('aria-label', 'Text size for session ' + session.id + ', ' + user);
    session.tab.title = session.guest ? user + ' · Shared terminal' : user + '@' + host;
    session.tab.setAttribute('aria-label', 'Session ' + session.id + ', ' + user +
      (session.guest ? ', shared terminal' : ' at ' + host));
    session.close.setAttribute('aria-label', 'Close session ' + session.id + ', ' + user);
  }

  function addSession(user, host, placement, guest = false) {
    const id = nextSession;
    const row = document.createElement('div');
    const tab = document.createElement('button');
    const close = document.createElement('button');
    const panel = document.createElement('section');
    const paneBar = document.createElement('div');
    const paneLabel = document.createElement('button');
    const paneActions = document.createElement('div');
    const shareButton = document.createElement('button');
    const forkButton = document.createElement('button');
    const minimize = document.createElement('button');
    const paneClose = document.createElement('button');
    const frame = document.createElement('div');
    const content = document.createElement('div');
    const cursorLayer = document.createElement('div');
    row.className = 'tab-row';
    row.setAttribute('role', 'presentation');
    tab.type = close.type = 'button';
    tab.id = 'tab-' + id;
    tab.className = 'tab-select';
    tab.setAttribute('role', 'tab');
    close.className = 'tab-close';
    close.append(controlIcon('close'));
    panel.id = 'terminal-' + id;
    panel.className = 'terminal-panel';
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', tab.id);
    tab.setAttribute('aria-controls', panel.id);
    paneBar.className = 'pane-bar';
    paneLabel.className = 'pane-label';
    paneLabel.type = 'button';
    paneLabel.setAttribute('aria-controls', fontMenu.id);
    paneLabel.setAttribute('aria-expanded', 'false');
    minimize.className = 'pane-minimize';
    minimize.type = 'button';
    minimize.setAttribute('aria-label', 'Minimize session ' + id);
    minimize.title = 'Minimize pane';
    minimize.append(controlIcon('minus'));
    paneClose.className = 'pane-close';
    paneClose.type = 'button';
    paneClose.title = 'Close session';
    paneClose.setAttribute('aria-label', 'Close terminal pane ' + id);
    paneClose.setAttribute('aria-haspopup', 'dialog');
    paneClose.append(controlIcon('close'));
    paneActions.className = 'pane-actions';
    shareButton.className = 'pane-share';
    shareButton.type = 'button';
    shareButton.title = 'Terminal sharing';
    shareButton.setAttribute('aria-label', 'Terminal sharing for pane ' + id);
    shareButton.setAttribute('aria-haspopup', 'dialog');
    shareButton.append(controlIcon('share'));
    shareButton.hidden = true;
    forkButton.className = 'pane-share pane-fork';
    forkButton.type = 'button';
    forkButton.title = 'Fork terminal in the same directory';
    forkButton.setAttribute('aria-label', 'Fork terminal pane ' + id);
    forkButton.append(controlIcon('fork'));
    forkButton.hidden = true;
    paneActions.append(shareButton, forkButton, minimize, paneClose);
    paneBar.append(paneLabel, paneActions);
    frame.className = 'terminal-with-padding';
    content.className = 'terminal-content';
    cursorLayer.className = 'peer-cursors';
    cursorLayer.setAttribute('aria-hidden', 'true');
    frame.append(content);
    panel.append(paneBar, frame);
    row.append(tab);
    tabs.append(row);

    const term = new Terminal({
      cursorBlink: !reducedMotion.matches,
      cursorStyle: 'block',
      scrollback: 6000,
      fontFamily: '"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace',
      fontSize: 13,
      lineHeight: 1.2,
      minimumContrastRatio: 4.5,
      // Option-drag on macOS, like Shift-drag elsewhere, selects text even when a program tracks the mouse.
      macOptionClickForcesSelection: true,
      theme: {
        background: '#000000', foreground: '#efefef', cursor: '#f0f0f0', cursorAccent: '#000000',
        selectionBackground: '#555555', selectionInactiveBackground: '#343434',
        black: '#000000', brightBlack: '#868686', white: '#dddddd', brightWhite: '#ffffff'
      }
    });
    const fit = new FitAddon();
    const serializer = guest ? null : new window.TTYShareVendor.SerializeAddon();
    const session = {
      id, row, tab, close, panel, paneLabel, term, fit, user, content, shareButton, forkButton, serializer, guest,
      state: 'offline', socket: null, timer: 0, lastSize: '', share: null, shares: new Set(), nextPeer: 1,
      cursorLayer, cursors: new Map(), cursorTimer: 0, localCursor: null, guestWrite: 0, stats: {rx: 0, tx: 0}
    };
    if (guest) panel.dataset.guest = 'true';
    sessions.push(session);
    changeSessionLabel(session, user, host);
    if (placement?.target && visiblePanes.has(placement.target)) {
      dockSession(session, placement.target, placement.axis, placement.first, false);
    } else {
      setActive(session);
    }
    term.loadAddon(fit);
    if (serializer) term.loadAddon(serializer);
    term.open(content);
    wireTouchScroll(session);
    wireSelection(session);
    inputLog?.watch(term.textarea);
    content.append(cursorLayer);
    wireSessionCursor(session);
    if (guest) term.onRender(() => sizeGuestFrame(session));
    else term.buffer.onBufferChange(buffer => {
      if (buffer.type === 'normal') {
        for (const flow of session.shares) if (flow.capturedAlternate) queueShareScreen(flow);
      }
    });

    tab.addEventListener('click', () => setActive(session, true));
    tab.addEventListener('pointerdown', event => beginDrag(event, session, true));
    tab.addEventListener('contextmenu', event => {
      if (event.pointerType === 'touch' || (!event.pointerType && mobile.matches)) event.preventDefault();
    });
    paneBar.addEventListener('pointerdown', event => {
      if (!event.target.closest('.pane-actions')) beginDrag(event, session);
    });
    paneLabel.addEventListener('click', () => toggleFontMenu(session));
    paneBar.addEventListener('click', event => {
      if (!event.target.closest('button')) setActive(session, true);
    });
    minimize.addEventListener('click', () => minimizePane(session));
    shareButton.addEventListener('click', () => openSharing(session, shareButton));
    forkButton.addEventListener('click', () => forkTerminal(session));
    frame.addEventListener('pointerdown', () => setActive(session));
    frame.addEventListener('focusin', () => { if (active !== session) setActive(session); });
    function requestClose() {
      closingSession = session;
      $('close-detail').textContent = session.state === 'online'
        ? 'The terminal connection will end.'
        : 'The terminal and its scrollback will be removed.';
      showDialog(closeDialog);
    }
    close.addEventListener('click', requestClose);
    session.requestClose = requestClose;
    tab.addEventListener('keydown', event => {
      if (event.key === 'Delete' || event.key === 'Backspace') requestClose();
    });
    paneClose.addEventListener('click', requestClose);
    term.onData(data => {
      if (session.state === 'offline' && !session.guest) {
        if (data === '\r' && !connectDialog.open) openConnect(session);
        return;
      }
      if (!session.guestWrite) writeBytes(session, encoder.encode(session === active ? applyTypedModifiers(data) : data));
    });
    // qtty announces the session a pane shows, so the pane can return to it later.
    if (!guest) term.parser.registerOscHandler(5379, data => {
      const [kind, name = ''] = data.split(';');
      if (kind !== 'qtty' || (name && !qttyName.test(name))) return true;
      session.qtty = name || null;
      changeSessionLabel(session, session.user, session.host);
      saveWorkspace();
      return true;
    });
    term.onBinary(data => {
      if (!session.guestWrite) writeBytes(session, Uint8Array.from(data, character => character.charCodeAt(0)));
    });
    term.attachCustomKeyEventHandler(event => {
      if (event.type !== 'keydown') return true;
      const clipboard = navigator.clipboard;
      const shortcut = (event.ctrlKey || event.metaKey) && event.shiftKey;
      if (shortcut && event.code === 'KeyC' && term.hasSelection() && clipboard?.writeText) {
        event.preventDefault();
        clipboard.writeText(term.getSelection()).catch(() => {});
        return false;
      }
      if (shortcut && event.code === 'KeyV' && clipboard?.readText) {
        event.preventDefault();
        clipboard.readText().then(text => {
          if (session === active && session.state === 'online') term.paste(text);
        }).catch(() => {});
        return false;
      }
      if (session === active && hasModifiers() && specialKeys.has(event.key)) {
        event.preventDefault();
        sendSpecial(event.key, event);
        return false;
      }
      return true;
    });
    return session;
  }

  // A resumable session outlives its WebSocket. Moving between Wi-Fi and
  // cellular kills the TCP path without a close frame, so heartbeats detect the
  // dead link and a new socket resumes the same PTY. Output is counted by byte
  // offset for replay; unacknowledged input is resent after the gateway reports
  // how many bytes it received.
  const qttyName = /^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$/;
  const workspaceKey = 'tty-workspace';

  // Panes showing qtty sessions are kept so a later visit can reopen them.
  function saveWorkspace() {
    const panes = sessions.filter(session => !session.guest && session.qtty && session.host)
      .map(({user, host, qtty}) => ({user, host, qtty}));
    try {
      if (panes.length) localStorage.setItem(workspaceKey, JSON.stringify(panes));
      else localStorage.removeItem(workspaceKey);
    } catch (_) {}
  }

  function reconnectHint(session) {
    session.term.writeln(session.qtty
      ? '\x1b[2mPress Enter to sign in again and return to qtty session ' + session.qtty + '.\x1b[0m'
      : '\x1b[2mPress Enter to reconnect.\x1b[0m');
  }

  function restoreWorkspace() {
    let panes = [];
    try { panes = JSON.parse(localStorage.getItem(workspaceKey) || '[]'); } catch (_) {}
    if (!Array.isArray(panes)) return [];
    const restored = panes.filter(pane => pane && sshUser.test(pane.user) && qttyName.test(pane.qtty)
      && typeof pane.host === 'string' && tunnelHost.test(pane.host)).slice(0, 12).map(pane => {
      const session = addSession(pane.user, pane.host, null);
      nextSession++;
      session.qtty = pane.qtty;
      changeSessionLabel(session, pane.user, pane.host);
      session.term.writeln('qtty session ' + pane.qtty + ' is waiting on ' + pane.host + '.');
      reconnectHint(session);
      return session;
    });
    if (restored.length) toggleSidebar(true);
    return restored;
  }

  // Fork opens a new pane beside SESSION with a new qtty session in the same
  // directory. It borrows the parent's SSH login when the gateway still has
  // it; otherwise the new pane shows the usual password prompt.
  function forkTerminal(parent) {
    if (parent.guest || !parent.host) return;
    const placement = {target: parent, axis: mobile.matches ? 'column' : 'row', first: false};
    const from = parent.qtty || undefined;
    if (parent.state !== 'online' || !parent.resume) {
      openConnect(null, true, visiblePanes.has(parent) ? placement : null, from || null);
      if (parent.host) prefillLink(parent);
      return;
    }
    const {host, id, secret} = parent.resume;
    const session = addSession(parent.user, host, visiblePanes.has(parent) ? placement : null);
    nextSession++;
    session.forkFrom = from;
    session.state = 'connecting';
    session.ended = false;
    session.stats = {rx: 0, tx: 0};
    updateStatus();
    const started = performance.now();
    let socket;
    const fail = message => {
      if (session.socket !== socket) return;
      endSocket(session);
      session.term.writeln(message);
      reconnectHint(session);
      updateStatus();
    };
    try {
      socket = new WebSocket('wss://' + host + '/ws');
    } catch (_) {
      session.socket = null;
      session.state = 'offline';
      session.term.writeln('Couldn’t open a WebSocket for the new terminal.');
      reconnectHint(session);
      updateStatus();
      return;
    }
    session.socket = socket;
    socket.binaryType = 'arraybuffer';
    session.timer = setTimeout(() => fail('The new terminal didn’t open in time.'), 20000);
    socket.onopen = () => {
      if (session.socket !== socket) return;
      fitTerminal(session);
      const {cols, rows} = session.term;
      socket.send(JSON.stringify({type: 'fork', v: 1, session: id, resume: secret, cols, rows,
        ...(from ? {fork: from} : {})}));
    };
    socket.onmessage = ({data}) => {
      if (session.socket !== socket) return;
      sawTraffic(session);
      if (data instanceof ArrayBuffer) {
        if (session.state === 'online') receiveOutput(session, data);
        return;
      }
      let message;
      try { message = JSON.parse(data); } catch (_) { return; }
      if (message?.type === 'ready' && session.state === 'connecting') {
        clearTimeout(session.timer);
        session.state = 'online';
        startResume(session, host, message);
        session.stats.started = performance.now();
        session.stats.handshake = session.stats.started - started;
        session.term.reset();
        updateStatus();
        fitTerminal(session);
        live('Session ' + session.id + ' forked from session ' + parent.id + '.');
      } else if (message?.type === 'error' && session.state === 'connecting') {
        fail(typeof message.message === 'string' ? message.message.slice(0, 200) : 'The gateway refused the fork.');
      } else {
        handleControl(session, socket, message);
      }
    };
    socket.onclose = event => {
      if (session.socket !== socket) return;
      if (session.state === 'connecting') fail('The new terminal closed before it opened.');
      else closedOnline(session, event);
    };
  }

  function prefillLink(session) {
    const saved = readRecents().find(entry => entry.user === session.user && parseLink(entry.link)?.host === session.host);
    if (saved && !endpoint.value) {
      endpoint.value = saved.link;
      renderForm();
    }
  }

  const resumeTiming = {ping: 5000, answer: 8000, probe: 3000, attempt: 8000, window: 15 * 60 * 1000};
  const resumeInputLimit = 1 << 20;

  function startResume(session, host, message) {
    if (typeof message.session !== 'string' || typeof message.resume !== 'string') return;
    session.resume = {
      host, id: message.session, secret: message.resume, offset: 0,
      pending: [], pendingBytes: 0, acked: 0, lastSeen: performance.now(), awaiting: 0, limit: resumeTiming.answer,
      since: 0, attempt: 0, retry: 0, heartbeat: setInterval(() => heartbeat(session), 1000)
    };
  }

  function stopResume(session) {
    const resume = session.resume;
    if (!resume) return;
    session.resume = null;
    clearInterval(resume.heartbeat);
    clearTimeout(resume.retry);
  }

  function trackInput(session, bytes) {
    const resume = session.resume;
    if (!resume) return;
    resume.pending.push(bytes.slice());
    resume.pendingBytes += bytes.length;
    while (resume.pendingBytes > resumeInputLimit && resume.pending.length > 1) {
      const dropped = resume.pending.shift();
      resume.pendingBytes -= dropped.length;
      resume.acked += dropped.length;
    }
  }

  function acknowledgeInput(session, received) {
    const resume = session.resume;
    if (!resume || !Number.isSafeInteger(received)) return;
    while (resume.pending.length && received > resume.acked) {
      const first = resume.pending[0];
      const used = Math.min(first.length, received - resume.acked);
      resume.acked += used;
      resume.pendingBytes -= used;
      if (used === first.length) resume.pending.shift();
      else resume.pending[0] = first.subarray(used);
    }
  }

  function sawTraffic(session) {
    if (!session.resume) return;
    session.resume.lastSeen = performance.now();
    session.resume.awaiting = 0;
  }

  function heartbeat(session) {
    const resume = session.resume, socket = session.socket;
    if (!resume || session.state !== 'online' || socket?.readyState !== WebSocket.OPEN) return;
    const now = performance.now();
    if (resume.awaiting && now - resume.awaiting > resume.limit) {
      linkLost(session);
    } else if (!resume.awaiting && now - resume.lastSeen >= resumeTiming.ping) {
      resume.awaiting = now;
      resume.limit = resumeTiming.answer;
      socket.send(JSON.stringify({type: 'ping'}));
    }
  }

  // The network may have changed: ask for a quick answer instead of waiting.
  function probeLinks() {
    for (const session of sessions) {
      const resume = session.resume;
      if (!resume) continue;
      if (session.state === 'reconnecting') {
        clearTimeout(resume.retry);
        resume.attempt = 0;
        if (!session.socket) resumeSession(session);
      } else if (session.state === 'online' && session.socket?.readyState === WebSocket.OPEN && !resume.awaiting) {
        resume.awaiting = performance.now();
        resume.limit = resumeTiming.probe;
        session.socket.send(JSON.stringify({type: 'ping'}));
      }
    }
  }

  function detachSocket(session) {
    const socket = session.socket;
    session.socket = null;
    if (!socket) return;
    socket.onopen = socket.onmessage = socket.onclose = socket.onerror = null;
    // A plain close leaves the gateway's PTY waiting for this tab to return.
    try { if (socket.readyState < WebSocket.CLOSING) socket.close(); } catch (_) {}
  }

  function linkLost(session) {
    const resume = session.resume;
    detachSocket(session);
    if (session.state !== 'reconnecting') {
      session.state = 'reconnecting';
      resume.since = performance.now();
      resume.attempt = 0;
      updateStatus();
      if (session === active) live('Session ' + session.id + ' is reconnecting.');
    }
    scheduleResume(session);
  }

  function scheduleResume(session) {
    const resume = session.resume;
    clearTimeout(resume.retry);
    if (performance.now() - resume.since > resumeTiming.window) {
      finishResume(session, 'Session disconnected.');
      return;
    }
    const delay = navigator.onLine === false ? 5000 : Math.min(5000, resume.attempt ? 250 * 2 ** resume.attempt : 0);
    resume.attempt++;
    resume.retry = setTimeout(() => resumeSession(session), delay);
  }

  function finishResume(session, message) {
    endSocket(session);
    session.term.writeln('\r\n' + message);
    if (!session.guest) reconnectHint(session);
    updateStatus();
    if (session === active) {
      clearModifiers();
      updateViewport();
      live('Session ' + session.id + ' disconnected.');
    }
  }

  function receiveOutput(session, data) {
    const bytes = new Uint8Array(data);
    if (session.resume) session.resume.offset += bytes.length;
    recordTraffic(session, 'rx', bytes.length);
    for (const flow of session.shares) mirrorShareOutput(flow, bytes);
    session.term.write(bytes);
  }

  function resumeSession(session) {
    const resume = session.resume;
    if (!resume || session.state !== 'reconnecting' || session.socket) return;
    let socket;
    try {
      socket = new WebSocket('wss://' + resume.host + '/ws');
    } catch (_) {
      scheduleResume(session);
      return;
    }
    session.socket = socket;
    socket.binaryType = 'arraybuffer';
    const timer = setTimeout(() => {
      if (session.socket !== socket) return;
      detachSocket(session);
      scheduleResume(session);
    }, resumeTiming.attempt);
    socket.onopen = () => {
      if (visiblePanes.has(session)) session.fit.fit();
      const {cols, rows} = session.term;
      session.lastSize = cols + 'x' + rows;
      socket.send(JSON.stringify({
        type: 'resume', v: 1, session: resume.id, resume: resume.secret, offset: resume.offset, cols, rows
      }));
    };
    socket.onmessage = ({data}) => {
      if (session.socket !== socket) return;
      sawTraffic(session);
      if (data instanceof ArrayBuffer) {
        if (session.state === 'online') receiveOutput(session, data);
        return;
      }
      let message;
      try { message = JSON.parse(data); } catch (_) { return; }
      if (message?.type === 'resumed' && session.state === 'reconnecting') {
        clearTimeout(timer);
        if (Number.isSafeInteger(message.offset) && message.offset > resume.offset) {
          session.term.write('\r\n\x1b[2m[Some output was lost while offline]\x1b[0m\r\n');
          resume.offset = message.offset;
        }
        acknowledgeInput(session, message.in);
        for (const bytes of resume.pending) socket.send(bytes);
        session.state = 'online';
        resume.attempt = 0;
        updateStatus();
        if (session === active) live('Session ' + session.id + ' reconnected.');
        fitTerminal(session);
      } else if (message?.type === 'error' && session.state === 'reconnecting') {
        clearTimeout(timer);
        if (message.code === 'expired') finishResume(session, 'The session expired while offline.');
        else { detachSocket(session); scheduleResume(session); }
      } else {
        handleControl(session, socket, message);
      }
    };
    socket.onclose = event => {
      if (session.socket !== socket) return;
      clearTimeout(timer);
      if (session.state === 'online') closedOnline(session, event);
      else { session.socket = null; scheduleResume(session); }
    };
  }

  // Shared handling for an attached socket's control messages.
  function handleControl(session, socket, message) {
    if (message?.type === 'pong') {
      acknowledgeInput(session, message.in);
    } else if (message?.type === 'closed') {
      session.ended = true;
      socket.close(1000, 'Session ended');
    }
  }

  function closedOnline(session, {code, reason}) {
    if (session.resume && !session.ended && code !== 1000 && code !== 4000) {
      linkLost(session);
      return;
    }
    const message = reason === 'Ended by tunnel owner' ? 'The tunnel owner ended this session.'
      : session.ended ? 'Session ended.' : 'Session disconnected.';
    finishResume(session, message);
  }

  // Closing a pane mid-reconnect still releases its PTY on the gateway.
  function sendGoodbye(session) {
    const {host, id, secret, offset} = session.resume;
    const {cols, rows} = session.term;
    try {
      const socket = new WebSocket('wss://' + host + '/ws');
      socket.onopen = () => {
        socket.send(JSON.stringify({type: 'resume', v: 1, session: id, resume: secret, offset, cols, rows}));
        socket.send(JSON.stringify({type: 'bye'}));
      };
      socket.onmessage = () => socket.close();
      setTimeout(() => socket.close(), 5000);
    } catch (_) {}
  }

  // Text selection and clipboard. Desktop selection is xterm's own (Shift-drag
  // or Option-drag overrides a program's mouse tracking); right-click opens
  // the menu. On touch screens, a long press selects the word under the finger,
  // dragging extends the selection, and lifting the finger opens the menu.
  const termMenu = $('term-menu');
  const pasteField = $('term-paste-field');
  let menuSession = null;

  function canType(session) {
    return session.state === 'online' && (!session.guest || session.share?.permissions.write);
  }

  function showTermMenu(session, x, y) {
    menuSession = session;
    pasteField.hidden = true;
    pasteField.value = '';
    $('term-copy').disabled = !session.term.hasSelection();
    $('term-paste').disabled = !canType(session);
    termMenu.hidden = false;
    const {width, height} = termMenu.getBoundingClientRect();
    const left = Math.max(8, Math.min(x - width / 2, innerWidth - width - 8));
    const top = y - height - 14 > 8 ? y - height - 14 : Math.min(y + 18, innerHeight - height - 8);
    termMenu.style.left = left + 'px';
    termMenu.style.top = top + 'px';
  }

  function hideTermMenu() {
    termMenu.hidden = true;
    pasteField.hidden = true;
    menuSession = null;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      const scratch = document.createElement('textarea');
      scratch.value = text;
      scratch.setAttribute('readonly', '');
      scratch.style.cssText = 'position:fixed;opacity:0;inset:0 auto auto 0';
      document.body.append(scratch);
      scratch.select();
      document.execCommand('copy');
      scratch.remove();
    }
  }

  $('term-copy').addEventListener('click', async () => {
    const session = menuSession;
    if (!session?.term.hasSelection()) return;
    await copyText(session.term.getSelection());
    session.term.clearSelection();
    hideTermMenu();
    live('Copied to the clipboard.');
  });
  $('term-paste').addEventListener('click', async () => {
    const session = menuSession;
    if (!session || !canType(session)) return;
    try {
      const text = await navigator.clipboard.readText();
      hideTermMenu();
      if (text) session.term.paste(text);
      session.term.focus();
    } catch (_) {
      // Some browsers only allow pasting through their own paste gesture.
      pasteField.hidden = false;
      pasteField.focus();
    }
  });
  pasteField.addEventListener('input', () => {
    const session = menuSession;
    const text = pasteField.value;
    if (!session || !text) return;
    hideTermMenu();
    if (canType(session)) session.term.paste(text);
  });
  $('term-select-all').addEventListener('click', () => {
    if (!menuSession) return;
    menuSession.term.selectAll();
    $('term-copy').disabled = false;
  });
  document.addEventListener('pointerdown', event => {
    if (!termMenu.hidden && !termMenu.contains(event.target)) hideTermMenu();
  }, true);
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && !termMenu.hidden) hideTermMenu(); });

  function cellAt(session, x, y) {
    const term = session.term;
    const rect = (term.element.querySelector('.xterm-screen') || term.element).getBoundingClientRect();
    const col = Math.max(0, Math.min(term.cols - 1, Math.floor((x - rect.left) / (rect.width / term.cols))));
    const row = Math.max(0, Math.min(term.rows - 1, Math.floor((y - rect.top) / (rect.height / term.rows))));
    return {col, row: row + term.buffer.active.viewportY};
  }

  function wordAt(session, cell) {
    const line = session.term.buffer.active.getLine(cell.row);
    const text = line ? line.translateToString(false) : '';
    const word = character => Boolean(character) && !/[\s"'`()<>\[\]{}|,;]/.test(character);
    if (!word(text[cell.col])) return [cell, cell];
    let start = cell.col, end = cell.col;
    while (start > 0 && word(text[start - 1])) start--;
    while (end < text.length - 1 && word(text[end + 1])) end++;
    return [{col: start, row: cell.row}, {col: end, row: cell.row}];
  }

  function selectCells(session, from, to) {
    const cols = session.term.cols;
    const [start, end] = from.row * cols + from.col <= to.row * cols + to.col ? [from, to] : [to, from];
    session.term.select(start.col, start.row, (end.row - start.row) * cols + end.col - start.col + 1);
  }

  // Touch events keep going to the node the touch started on, and xterm
  // replaces row nodes as it redraws. Listening on that node itself still
  // works after it leaves the document; its ancestors stop hearing anything.
  function followTouch(event, handlers) {
    const targets = new Set([...event.touches].map(touch => touch.target).filter(Boolean));
    const stop = () => {
      for (const target of targets) {
        for (const [type, handler] of Object.entries(handlers)) target.removeEventListener(type, handler);
        target.removeEventListener('touchend', ended);
        target.removeEventListener('touchcancel', ended);
      }
    };
    const ended = event => { if (!event.touches.length) stop(); };
    for (const target of targets) {
      for (const [type, handler] of Object.entries(handlers)) target.addEventListener(type, handler, {passive: false});
      target.addEventListener('touchend', ended);
      target.addEventListener('touchcancel', ended);
    }
  }

  // Extend a selection from the word it started on to CELL, in either direction.
  function extendSelection(session, word, cell) {
    const [start, end] = word;
    const before = cell.row < start.row || (cell.row === start.row && cell.col < start.col);
    selectCells(session, before ? end : start, cell);
  }

  function wireSelection(session) {
    const element = session.term.element;
    let press = null, lastTouch = 0, lastTap = null;
    const cancel = () => {
      if (press) clearTimeout(press.timer);
      press = null;
    };
    const move = event => {
      if (!press || event.touches.length !== 1) return;
      const touch = event.touches[0];
      if (!press.active) {
        if (Math.hypot(touch.clientX - press.x, touch.clientY - press.y) > 10) cancel();
        return;
      }
      // Selecting: keep the viewport and the program's mouse handling still.
      event.preventDefault();
      event.stopPropagation();
      press.x = touch.clientX;
      press.y = touch.clientY;
      extendSelection(session, press.word, cellAt(session, press.x, press.y));
    };
    const finish = event => {
      lastTouch = performance.now();
      // A short, still touch is a tap; a second one soon after starts a selection.
      lastTap = press && !press.active && lastTouch - press.started < 250
        ? {time: lastTouch, x: press.x, y: press.y} : null;
      if (press?.active) {
        if (event.cancelable) event.preventDefault();
        event.stopPropagation();
        showTermMenu(session, press.x, press.y);
      }
      cancel();
    };
    element.addEventListener('touchstart', event => {
      lastTouch = performance.now();
      cancel();
      if (event.touches.length !== 1) {
        lastTap = null;
        return;
      }
      const touch = event.touches[0];
      const tap = lastTap;
      lastTap = null;
      if (tap && lastTouch - tap.time < 320 && Math.hypot(touch.clientX - tap.x, touch.clientY - tap.y) < 30) {
        // Double tap: select from here, and keep this touch from the program.
        event.preventDefault();
        event.stopPropagation();
        press = {x: touch.clientX, y: touch.clientY, active: true, started: lastTouch};
        press.word = wordAt(session, cellAt(session, press.x, press.y));
        selectCells(session, ...press.word);
        followTouch(event, {touchmove: move, touchend: finish, touchcancel: finish});
        return;
      }
      press = {x: touch.clientX, y: touch.clientY, active: false, word: null, started: lastTouch};
      press.timer = setTimeout(() => {
        if (!press) return;
        press.active = true;
        press.word = wordAt(session, cellAt(session, press.x, press.y));
        selectCells(session, ...press.word);
        navigator.vibrate?.(8);
      }, 450);
      followTouch(event, {touchmove: move, touchend: finish, touchcancel: finish});
    }, {passive: false, capture: true});
    // When a program tracks the mouse (Claude Code, Codex), xterm sends clicks to
    // it instead of selecting. A double-click then drag selects text anyway.
    element.addEventListener('mousedown', event => {
      // A right-click on a selection opens the menu; a program tracking the
      // mouse would otherwise receive it and xterm would drop the selection.
      if (event.button === 2 && session.term.hasSelection()) {
        event.stopPropagation();
        return;
      }
      if (event.button !== 0 || event.detail !== 2 || session.term.modes.mouseTrackingMode === 'none') return;
      event.preventDefault();
      event.stopPropagation();
      session.term.focus();
      const word = wordAt(session, cellAt(session, event.clientX, event.clientY));
      selectCells(session, ...word);
      const move = moved => {
        moved.stopPropagation();
        extendSelection(session, word, cellAt(session, moved.clientX, moved.clientY));
      };
      const up = released => {
        released.stopPropagation();
        document.removeEventListener('mousemove', move, true);
        document.removeEventListener('mouseup', up, true);
        if (session.term.hasSelection()) showTermMenu(session, released.clientX, released.clientY);
      };
      document.addEventListener('mousemove', move, true);
      document.addEventListener('mouseup', up, true);
    }, true);
    element.addEventListener('contextmenu', event => {
      event.preventDefault();
      // Android also reports a long press as a context menu; the touch path handles it.
      if (performance.now() - lastTouch < 1000) return;
      showTermMenu(session, event.clientX, event.clientY);
    });
  }

  // Diagnostic log of keyboard and dictation events, for adapting input
  // handling to a phone's dictation. Open the page with #input-log to show
  // it. Entries contain what you typed or dictated and never leave the page
  // unless you copy them.
  const inputLog = (() => {
    let enabled = false;
    try {
      if (location.hash === '#input-log') sessionStorage.setItem('tty-input-log', '1');
      enabled = sessionStorage.getItem('tty-input-log') === '1';
    } catch (_) {}
    if (!enabled) return null;
    const panel = document.createElement('section');
    panel.setAttribute('aria-label', 'Input event log');
    panel.style.cssText = 'position:fixed;inset:auto 0 0 0;z-index:9;max-block-size:34vh;display:grid;'
      + 'grid-template-rows:auto 1fr;background:#000;border-top:1px solid rgb(255 255 255 / .32);'
      + 'font:11px/1.35 ui-monospace,monospace;color:#d2d2d2';
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;gap:6px;align-items:center;padding:4px 8px';
    const title = document.createElement('strong');
    title.textContent = 'Input log';
    title.style.flex = '1';
    const list = document.createElement('pre');
    list.style.cssText = 'margin:0;padding:4px 8px 8px;overflow:auto;white-space:pre-wrap';
    const lines = [];
    let last = performance.now();
    const button = (label, action) => {
      const element = document.createElement('button');
      element.type = 'button';
      element.textContent = label;
      element.style.cssText = 'min-block-size:30px;padding:0 10px;border:1px solid rgb(255 255 255 / .32);'
        + 'border-radius:7px;background:transparent;color:inherit;font:inherit';
      element.addEventListener('click', action);
      return element;
    };
    bar.append(title, button('Copy', () => copyText(navigator.userAgent + '\n' + lines.join('\n'))),
      button('Clear', () => { lines.length = 0; list.textContent = ''; }),
      button('Close', () => { try { sessionStorage.removeItem('tty-input-log'); } catch (_) {} panel.remove(); }));
    panel.append(bar, list);
    document.body.append(panel);
    const record = event => {
      const now = performance.now();
      const target = event.target;
      const parts = ['+' + Math.round(now - last) + 'ms', event.type];
      last = now;
      if (event.inputType) parts.push(event.inputType);
      if (event.key !== undefined) parts.push('key=' + JSON.stringify(event.key), 'code=' + (event.keyCode ?? ''));
      if (event.data !== undefined && event.data !== null) parts.push('data=' + JSON.stringify(event.data));
      if (event.isComposing) parts.push('composing');
      if (event.dataTransfer) parts.push('transfer=' + JSON.stringify(event.dataTransfer.getData('text/plain')));
      if (event.getTargetRanges?.().length) parts.push('ranges=' + event.getTargetRanges().length);
      parts.push('value=' + JSON.stringify(target.value), 'sel=' + target.selectionStart + '-' + target.selectionEnd);
      lines.push(parts.join(' '));
      if (lines.length > 300) lines.shift();
      list.textContent = lines.slice(-60).join('\n');
      list.scrollTop = list.scrollHeight;
    };
    const types = ['keydown', 'keyup', 'beforeinput', 'input', 'compositionstart', 'compositionupdate', 'compositionend'];
    return {watch: textarea => { for (const type of types) textarea.addEventListener(type, record, true); }};
  })();

  // Two-finger drags become wheel events, so xterm treats them exactly like a
  // desktop wheel or trackpad: mouse-wheel reports when the program tracks the
  // mouse (Claude Code, Codex, vim, less), arrow keys in an alternate screen
  // without mouse tracking, and local scrollback otherwise.
  function wireTouchScroll(session) {
    const element = session.term.element;
    const screen = element.querySelector('.xterm-screen') || element;
    let last = null;
    const midpoint = touches => ({
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2
    });
    const move = event => {
      if (event.touches.length !== 2 || !last) return;
      // Keep xterm's one-finger viewport scroll and the page from also moving.
      event.preventDefault();
      event.stopPropagation();
      const point = midpoint(event.touches);
      const deltaY = last.y - point.y, deltaX = last.x - point.x;
      last = point;
      if (!deltaY) return;
      screen.dispatchEvent(new WheelEvent('wheel', {
        deltaX, deltaY, deltaMode: WheelEvent.DOM_DELTA_PIXEL, clientX: point.x, clientY: point.y,
        bubbles: true, cancelable: true
      }));
    };
    const end = event => { if (event.touches.length !== 2) last = null; };
    element.addEventListener('touchstart', event => {
      if (event.touches.length !== 2) return;
      last = midpoint(event.touches);
      followTouch(event, {touchmove: move, touchend: end, touchcancel: end});
    }, {passive: true, capture: true});
  }

  addEventListener('online', probeLinks);
  navigator.connection?.addEventListener?.('change', probeLinks);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') probeLinks(); });
  addEventListener('pageshow', probeLinks);

  function endSocket(session) {
    const socket = session.socket;
    if (session.resume && socket?.readyState === WebSocket.OPEN) {
      // Tell the gateway this is a deliberate disconnect, not a network change.
      try { socket.send(JSON.stringify({type: 'bye'})); } catch (_) {}
    } else if (session.resume) {
      sendGoodbye(session);
    }
    stopResume(session);
    session.socket = null;
    clearTimeout(session.timer);
    session.state = 'offline';
    if (session.stats.started && !session.stats.ended) session.stats.ended = performance.now();
    session.lastSize = '';
    stopSessionSharing(session);
    clearLocalCursor(session);
    if (socket && socket.readyState < WebSocket.CLOSING) socket.close(1000, 'Client disconnected');
  }

  function removeSession(session, next, previousLayout) {
    const index = sessions.indexOf(session);
    if (index < 0) return;
    endSocket(session);
    sessions.splice(index, 1);
    saveWorkspace();
    if (touchCloseRow === session.row) showTouchClose();
    paneLayout = previousLayout ?? replacePane(paneLayout, session, null);
    session.term.dispose();
    session.row.remove();
    session.panel.remove();
    renderPanes();
    if (active === session) setActive(next || firstPane(paneLayout) || sessions[index] || sessions[index - 1] || null);
    if (sessions.length === 0) toggleSidebar(false);
  }

  function renderForm() {
    const busy = Boolean(intake?.pending);
    endpoint.disabled = username.disabled = busy;
    recentToggle.disabled = busy;
    connectButton.disabled = busy || !parseLink(endpoint.value) || !sshUser.test(username.value.trim());
    connectButton.setAttribute('aria-busy', String(busy));
    $('spinner').hidden = !busy;
    $('connect-text').textContent = busy ? 'Connecting' : 'Connect';
  }

  function reportConnectError(message) {
    connectError.textContent = message;
    connectError.hidden = !message;
  }

  function positionConnectPanel() {
    if (!connectDialog.open) return;
    const bounds = connectDialog.getBoundingClientRect();
    const padding = Number.parseFloat(getComputedStyle(connectDialog).paddingTop);
    const latestCenter = bounds.top + bounds.height / 2;
    if (!mobile.matches || connectAnchor === null) {
      connectAnchor = keyboardOpen ? normalHeight / 2 : latestCenter;
    }
    const panelHeight = form.offsetHeight;
    const desiredTop = connectAnchor - bounds.top - panelHeight / 2;
    const lastTop = Math.max(padding, bounds.height - panelHeight - padding);
    const top = Math.max(padding, Math.min(desiredTop, lastTop));
    form.style.setProperty('--connect-offset', (top - padding) + 'px');
    if (!recentList.hidden) {
      const room = bounds.bottom - recentToggle.getBoundingClientRect().bottom - 12;
      recentList.style.setProperty('--recents-room', room + 'px');
    }
  }

  function fade(dialog, from, to) {
    if (reducedMotion.matches) return Promise.resolve();
    const duration = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fade'));
    return dialog.animate([{opacity: from}, {opacity: to}], {duration, easing: 'ease-out'}).finished;
  }

  function showDialog(dialog) {
    if (dialog.open) return;
    closeFontMenu();
    dialog.showModal();
    fade(dialog, 0, 1).catch(() => {});
    updateViewport();
  }

  async function hideDialog(dialog) {
    if (!dialog.open || dialog.dataset.closing) return;
    dialog.dataset.closing = 'true';
    const opacity = Number(getComputedStyle(dialog).opacity);
    for (const animation of dialog.getAnimations()) animation.cancel();
    await fade(dialog, opacity, 0).catch(() => {});
    dialog.close();
    delete dialog.dataset.closing;
    updateViewport();
  }

  function openConnect(reuse = null, focus = true, placement = null, fork = null) {
    if (connectDialog.open || closeDialog.open || shareDialog.open) return;
    showStats(false);
    intake = {reuse, placement, previous: active, previousLayout: paneLayout, pending: null, fork};
    connectAnchor = null;
    toggleRecents(false);
    endpoint.value = '';
    username.value = reuse?.user || active?.user || lastUser;
    // Offer the saved link for this pane's tunnel; a cycled tunnel needs a new one.
    if (reuse?.host) prefillLink(reuse);
    reportConnectError('');
    renderForm();
    showDialog(connectDialog);
    connectDialog.scrollTop = 0;
    if (focus && !mobile.matches) endpoint.focus({preventScroll: true});
  }

  function undoAttempt(view) {
    const session = view.pending;
    if (!session) return;
    view.pending = null;
    if (view.reuse) {
      endSocket(session);
      updateStatus();
    } else {
      removeSession(session, view.previous, view.previousLayout);
    }
  }

  async function dismissConnect(connected = false) {
    if (!intake) return;
    if (!connected) undoAttempt(intake);
    intake = null;
    toggleRecents(false);
    endpoint.value = '';
    await hideDialog(connectDialog);
    if (connected && !mobile.matches) active?.term.focus();
  }

  function startConnect(destination, user) {
    const view = intake;
    const session = view.reuse || addSession(user, destination.host, view.placement);
    const recentLink = 'https://' + destination.host + '/#tty=' + destination.token;
    view.pending = session;
    session.state = 'connecting';
    session.ended = false;
    session.stats = {rx: 0, tx: 0};
    const started = performance.now();
    updateStatus();
    toggleRecents(false);
    renderForm();
    fitTerminal();

    function failed(message) {
      if (intake !== view || view.pending !== session) return;
      undoAttempt(view);
      reportConnectError(message);
      renderForm();
      if (!mobile.matches) endpoint.focus({preventScroll: true});
    }

    let socket;
    try {
      // The fragment is sent in the hello frame, never in the request URL.
      socket = new WebSocket('wss://' + destination.host + '/ws');
    } catch (_) {
      failed('Couldn’t open the WebSocket. Check the browser terminal link.');
      return;
    }
    session.socket = socket;
    socket.binaryType = 'arraybuffer';
    session.timer = setTimeout(() => failed('Connection timed out. Check that the browser tunnel is running.'), 20000);
    socket.onopen = () => {
      if (session.socket !== socket) return;
      fitTerminal();
      const {cols, rows} = session.term;
      const fork = view.fork || view.reuse?.forkFrom;
      const attach = view.reuse?.qtty ? {attach: view.reuse.qtty} : fork ? {fork} : {};
      socket.send(JSON.stringify({type: 'hello', v: 1, token: destination.token, user, cols, rows, resume: true, ...attach}));
      destination.token = '';
    };
    socket.onmessage = ({data}) => {
      if (session.socket !== socket) return;
      sawTraffic(session);
      if (data instanceof ArrayBuffer) {
        if (session.state === 'online') receiveOutput(session, data);
        return;
      }
      let message;
      try { message = JSON.parse(data); } catch (_) { return; }
      if (message?.type === 'ready' && message.v === 1 && session.state === 'connecting') {
        clearTimeout(session.timer);
        view.pending = null;
        if (!view.reuse) {
          if (sessions.length === 1) toggleSidebar(true);
          nextSession++;
        }
        session.state = 'online';
        startResume(session, destination.host, message);
        session.stats.started = performance.now();
        session.stats.handshake = session.stats.started - started;
        session.term.reset();
        changeSessionLabel(session, user, destination.host);
        lastUser = user;
        try { localStorage.setItem('tty-last-user', user); } catch (_) {}
        rememberRecent(recentLink, user);
        updateStatus();
        live('Session ' + session.id + ' connected.');
        fitTerminal();
        dismissConnect(true);
      } else if (message?.type === 'error' && session.state === 'connecting') {
        failed(typeof message.message === 'string' ? message.message.slice(0, 200) : 'The gateway rejected the connection.');
      } else {
        handleControl(session, socket, message);
      }
    };
    socket.onclose = event => {
      if (session.socket !== socket) return;
      if (session.state === 'connecting') {
        failed('Couldn’t reach the terminal. Check the link and browser tunnel mode.');
        return;
      }
      closedOnline(session, event);
    };
  }

  function updateViewport() {
    const viewport = window.visualViewport;
    const width = viewport?.width ?? innerWidth;
    const top = viewport?.offsetTop ?? 0;
    const bounds = navigator.virtualKeyboard?.boundingRect;
    const visibleHeight = viewport?.height ?? innerHeight;
    const height = bounds?.height && bounds.top > top ? Math.min(visibleHeight, bounds.top - top) : visibleHeight;
    if (Math.abs(width - lastWidth) > 24) {
      normalHeight = visibleHeight;
      lastWidth = width;
      connectAnchor = null;
    }
    const layoutHeight = document.documentElement.clientHeight;
    normalHeight = Math.max(normalHeight, height, layoutHeight);
    const occluded = Math.max(normalHeight - height, bounds?.height || 0);
    const wasOpen = keyboardOpen;
    keyboardOpen = mobile.matches && occluded >= Math.min(105, normalHeight * .18);
    if (wasOpen && !keyboardOpen) clearModifiers();
    document.documentElement.style.setProperty('--viewport-top', top + 'px');
    document.documentElement.style.setProperty('--viewport-height', height + 'px');
    app.dataset.keyboard = String(keyboardOpen);
    softKeys.hidden = !(keyboardOpen && active?.state === 'online'
      && (!active.guest || active.share?.permissions.write)
      && document.activeElement === active.term.textarea && !connectDialog.open && !closeDialog.open && !shareDialog.open);
    positionConnectPanel();
    positionFontMenu();
  }

  const cursorKeys = new Map([
    ['ArrowLeft', 'D'], ['ArrowUp', 'A'], ['ArrowDown', 'B'], ['ArrowRight', 'C'],
    ['Home', 'H'], ['End', 'F']
  ]);
  const functionKeys = new Map([['F1', 'P'], ['F2', 'Q'], ['F3', 'R'], ['F4', 'S']]);
  // Map xterm's numbered escape sequences for the remaining navigation keys.
  const numberedKeys = new Map([
    ['Insert', 2], ['Delete', 3], ['PageUp', 5], ['PageDown', 6],
    ['F5', 15], ['F6', 17], ['F7', 18], ['F8', 19], ['F9', 20], ['F10', 21], ['F11', 23], ['F12', 24]
  ]);
  const simpleKeys = new Map([['Escape', '\x1b'], ['Tab', '\t'], ['Backspace', '\x7f'], ['Enter', '\r']]);
  const specialKeys = new Set([...cursorKeys.keys(), ...functionKeys.keys(), ...numberedKeys.keys(), ...simpleKeys.keys()]);
  const shifted = Object.fromEntries(Array.from('\x601234567890-=\\[];\',./',
    (character, index) => [character, '~!@#$%^&*()_+|{}:"<>?'[index]]));
  const controls = new Map([
    [' ', '\0'], ['@', '\0'], ['2', '\0'], ['[', '\x1b'], ['3', '\x1b'],
    ['\\', '\x1c'], ['4', '\x1c'], [']', '\x1d'], ['5', '\x1d'],
    ['^', '\x1e'], ['6', '\x1e'], ['_', '\x1f'], ['-', '\x1f'], ['7', '\x1f'], ['?', '\x7f'], ['8', '\x7f']
  ]);

  function hasModifiers() {
    return modifiers.Ctrl || modifiers.Shift || modifiers.Alt;
  }

  function encodeSpecial(key, event = {}) {
    const ctrl = modifiers.Ctrl || event.ctrlKey;
    const shift = modifiers.Shift || event.shiftKey;
    const alt = modifiers.Alt || event.altKey;
    const parameter = 1 + Number(Boolean(shift)) + 2 * Number(Boolean(alt)) + 4 * Number(Boolean(ctrl));
    const cursor = cursorKeys.get(key);
    if (cursor) {
      if (parameter > 1) return '\x1b[1;' + parameter + cursor;
      return (active.term.modes.applicationCursorKeysMode ? '\x1bO' : '\x1b[') + cursor;
    }
    const fn = functionKeys.get(key);
    if (fn) return parameter > 1 ? '\x1b[1;' + parameter + fn : '\x1bO' + fn;
    if (numberedKeys.has(key)) {
      return '\x1b[' + numberedKeys.get(key) + (parameter > 1 ? ';' + parameter : '') + '~';
    }
    if (key === 'Tab' && shift) return '\x1b[Z';
    const value = key === 'Backspace' && ctrl ? '\b' : simpleKeys.get(key);
    return (alt ? '\x1b' : '') + value;
  }

  function sendSpecial(key, event) {
    if (!active || active.state !== 'online') return;
    const data = encodeSpecial(key, event);
    clearModifiers();
    writeBytes(active, encoder.encode(data));
  }

  function applyTypedModifiers(data) {
    if (!hasModifiers()) return data;
    if (data === '\t' || data === '\r' || data === '\x7f') {
      const key = data === '\t' ? 'Tab' : data === '\r' ? 'Enter' : 'Backspace';
      const value = encodeSpecial(key);
      clearModifiers();
      return value;
    }
    if (Array.from(data).length !== 1 || data < ' ') return data;
    let value = modifiers.Shift ? (shifted[data] || data.toUpperCase()) : data;
    if (modifiers.Ctrl) {
      if (/^[a-z]$/i.test(value)) value = String.fromCharCode(value.toUpperCase().charCodeAt(0) - 64);
      else value = controls.get(value) ?? value;
    }
    if (modifiers.Alt) value = '\x1b' + value;
    clearModifiers();
    return value;
  }

  const keyLabels = [
    ['Ctrl', 'Ctrl'], ['Shift', 'Shift'], ['Alt', 'Alt'], ['Escape', 'Esc'], ['Tab', 'Tab'],
    ['ArrowLeft', '←'], ['ArrowUp', '↑'], ['ArrowDown', '↓'], ['ArrowRight', '→'],
    ['Home', 'Home'], ['End', 'End'], ['PageUp', 'PgUp'], ['PageDown', 'PgDn'],
    ['Backspace', '⌫'], ['Delete', 'Del'], ['Insert', 'Ins'], ['Enter', 'Enter'],
    ...Array.from({length: 12}, (_, index) => ['F' + (index + 1), 'F' + (index + 1)])
  ];
  for (const [key, label] of keyLabels) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.setAttribute('aria-label', key.replace(/^Arrow/, 'Arrow '));
    if (Object.hasOwn(modifiers, key)) {
      modifierButtons.set(key, button);
      button.setAttribute('aria-pressed', 'false');
    }
    button.addEventListener('mousedown', event => event.preventDefault());
    button.addEventListener('click', () => {
      if (modifierButtons.has(key)) {
        modifiers[key] = !modifiers[key];
        button.setAttribute('aria-pressed', String(modifiers[key]));
      } else {
        sendSpecial(key);
      }
      active?.term.focus();
    });
    softKeys.append(button);
  }

  function dismissOnOutside(dialog, dismiss) {
    let startedOutside = false;
    dialog.addEventListener('pointerdown', event => { startedOutside = event.target === dialog; });
    dialog.addEventListener('click', event => {
      if (startedOutside && event.target === dialog) dismiss();
      startedOutside = false;
    });
    dialog.addEventListener('cancel', event => {
      event.preventDefault();
      dismiss();
    });
  }

  function dismissClose() {
    closingSession = null;
    return hideDialog(closeDialog);
  }

  dismissOnOutside(connectDialog, () => dismissConnect());
  dismissOnOutside(closeDialog, dismissClose);
  sidebarToggle.addEventListener('click', () => toggleSidebar(!sidebarOpen));
  addButton.addEventListener('click', () => openConnect());
  addButton.addEventListener('pointerdown', event => beginDrag(event, null));
  $('add-sidebar-session').addEventListener('click', () => openConnect());
  recentToggle.addEventListener('click', () => toggleRecents(recentList.hidden));
  clearRecents.addEventListener('click', () => {
    storeRecents([]);
    renderRecents();
    recentToggle.focus({preventScroll: true});
  });
  smallerFont.addEventListener('click', () => changeFontSize(-1));
  largerFont.addEventListener('click', () => changeFontSize(1));
  wireSharing();
  $('keep-session').addEventListener('click', dismissClose);
  $('close-session').addEventListener('click', async () => {
    const session = closingSession;
    if (!session) return;
    await dismissClose();
    removeSession(session);
    (active?.tab || statusButton).focus();
    live('Session ' + session.id + ' closed.');
  });
  tabs.addEventListener('keydown', event => {
    const index = sessions.findIndex(session => session.tab === event.target);
    if (index < 0) return;
    let next;
    if (event.key === 'ArrowUp') next = (index + sessions.length - 1) % sessions.length;
    else if (event.key === 'ArrowDown') next = (index + 1) % sessions.length;
    else if (event.key === 'Home') next = 0;
    else if (event.key === 'End') next = sessions.length - 1;
    else return;
    event.preventDefault();
    setActive(sessions[next]);
    sessions[next].tab.focus();
  });
  addEventListener('pointermove', moveDrag, {passive: false});
  addEventListener('pointerup', finishDrag);
  addEventListener('pointercancel', finishDrag);
  document.addEventListener('pointerdown', event => {
    if (fontSession && !fontMenu.contains(event.target) && !fontSession.paneLabel.contains(event.target)) {
      closeFontMenu();
    }
    if (touchCloseRow && !touchCloseRow.contains(event.target)) showTouchClose();
    if (!recentList.hidden && !recents.contains(event.target)) toggleRecents(false);
  }, true);
  addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (drag?.moved) {
      event.preventDefault();
      finishDrag({type: 'pointercancel', pointerId: drag.pointer});
    } else if (fontSession) {
      event.preventDefault();
      event.stopPropagation();
      closeFontMenu(true);
    } else if (!recentList.hidden) {
      event.preventDefault();
      event.stopPropagation();
      toggleRecents(false);
      recentToggle.focus({preventScroll: true});
    }
  }, true);
  document.addEventListener('click', event => {
    if (suppressClick === event.target || (suppressClick === addButton && addButton.contains(event.target))) {
      suppressClick = null;
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
  form.addEventListener('input', () => {
    reportConnectError('');
    renderForm();
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (!intake || connectButton.disabled) return;
    const destination = parseLink(endpoint.value);
    const user = username.value.trim();
    if (destination && sshUser.test(user)) startConnect(destination, user);
  });

  addEventListener('resize', updateViewport);
  window.visualViewport?.addEventListener('resize', updateViewport);
  window.visualViewport?.addEventListener('scroll', updateViewport);
  navigator.virtualKeyboard?.addEventListener('geometrychange', updateViewport);
  document.addEventListener('focusin', event => {
    if (fontSession && !fontMenu.contains(event.target) && !fontSession.paneLabel.contains(event.target)) {
      closeFontMenu();
    }
    if (!recentList.hidden && !recents.contains(event.target)) toggleRecents(false);
    updateViewport();
  });
  document.addEventListener('focusout', () => requestAnimationFrame(updateViewport));
  new ResizeObserver(scheduleFit).observe(terminals);
  new ResizeObserver(positionConnectPanel).observe(form);
  // Safari can dispatch proprietary gestures even when scaling is disabled in the viewport.
  for (const type of ['gesturestart', 'gesturechange']) {
    document.addEventListener(type, event => event.preventDefault(), {passive: false});
  }
  document.addEventListener('touchstart', event => {
    if (event.touches.length > 1) event.preventDefault();
  }, {passive: false});
  addEventListener('pagehide', () => {
    stopCamera();
    clearSharePin();
    closeShare(shareView?.flow);
    showStats(false);
    for (const session of sessions) endSocket(session);
    if (intake?.pending) undoAttempt(intake);
    endpoint.value = '';
    renderForm();
    updateStatus();
  });
  addEventListener('blur', () => { for (const session of sessions) clearLocalCursor(session); });

  function consumeInviteLink() {
    const inviteLink = location.href;
    if (!sharing.parseInvite(inviteLink)) return false;
    history.replaceState(history.state, '', location.pathname + location.search);
    showInviteLink(inviteLink);
    return true;
  }

  async function showInviteLink(inviteLink) {
    if (connectDialog.open) await dismissConnect();
    if (closeDialog.open) await dismissClose();
    if (shareDialog.open) await dismissSharing(false);
    openSharing(null, statusButton, 'connect', inviteLink);
  }

  updateViewport();
  addEventListener('hashchange', consumeInviteLink);
  const restoredPanes = restoreWorkspace();
  if (!consumeInviteLink()) openConnect(restoredPanes[0] || null, false);
})();
</script>
</body></html>
